    <meta name="theme-color" content="#4f46e5">

    <link rel="preconnect" href="https://fonts.googleapis.com">

        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Poppins', 'Inter', 'sans-serif'] } } } };

    <style>
        :root { --ink:#14213d; --muted:#556072; --line:#e6e9f0; --bg:#f6f7fb; --brand:#4f46e5; --brand-d:#4338ca; }
        html { scroll-behavior: smooth; scroll-padding-top: 76px; }
        body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Poppins', 'Inter', sans-serif; }

        /* Botões e campos */
        .btn { min-height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(79,70,229,.55); }
        .btn-primary:hover { background: var(--brand-d); }
        .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { background: #f1f3f9; }
        .btn-danger { background: #fff; color: #b42318; border: 1px solid #f3c9c5; }
        .btn-danger:hover { background: #fdf0ef; }
        .btn-sm { min-height: 40px; padding: 0 14px; font-size: 13px; }
        .field { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; color: var(--ink); }
        textarea.field { padding: 10px 12px; min-height: 96px; }
        .field-sm { min-height: 40px; font-size: 13px; }
        .label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        :focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
        .field:focus { border-color: var(--brand); outline: 3px solid #c7d2fe; outline-offset: 0; }

        /* Cartões e abas */
        .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; }
        .aba { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); background: #fff; border: 1px solid var(--line); transition: background-color .15s ease, color .15s ease; }
        .aba:hover { background: #eef0fb; }
        .aba-ativa { background: var(--ink); color: #fff; border-color: var(--ink); }
        .aba-ativa:hover { background: var(--ink); }

        .foto-preview { width: 52px; height: 52px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; transition: transform .15s ease; flex-shrink: 0; }
        .foto-preview:hover { transform: scale(1.05); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(20,33,61,.6); z-index: 50; align-items: flex-end; justify-content: center; padding: 0; }
        .modal.active { display: flex; }
        .modal-box { animation: subir .2s ease-out; }        @keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (min-width: 640px) { .modal { align-items: center; padding: 20px; } }

        /* Popup rápido de confirmação */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 16px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 70; box-shadow: 0 10px 30px -10px rgba(20,33,61,.5); max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
        @media print { .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body>

    <!-- MODAL DE DETALHES -->
    <div id="modalAluno" class="modal no-print" onclick="fecharModal(event)" role="dialog" aria-modal="true" aria-label="Detalhes do aluno">
        <div class="modal-box bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div id="modalConteudo"></div>
            <button onclick="document.getElementById('modalAluno').classList.remove('active')" class="btn btn-primary w-full mt-6">Fechar e salvar</button>
        </div>
    </div>

    <!-- CONFIRMAÇÃO DE EXCLUSÃO (do site) -->
<div id="modalConfirma" class="modal no-print" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTitulo" onclick="if (event.target === this) responderConfirma(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="confirmaTitulo" class="font-display font-semibold text-xl"></h2>
        <p id="confirmaTexto" class="mt-2 text-sm" style="color:var(--muted)"></p>
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderConfirma(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderConfirma(true)" class="btn btn-danger">Excluir</button>
        </div>
    </div>
</div>
<!-- JANELA DE TEXTO (renomear turma) -->
<div id="modalPrompt" class="modal no-print" role="dialog" aria-modal="true" aria-labelledby="promptTitulo" onclick="if (event.target === this) responderPrompt(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="promptTitulo" class="font-display font-semibold text-xl"></h2>
        <label for="promptInput" id="promptTexto" class="label mt-3"></label>
        <input id="promptInput" type="text" class="field" onkeydown="if (event.key === 'Enter') responderPrompt(true); if (event.key === 'Escape') responderPrompt(false);">
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderPrompt(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderPrompt(true)" class="btn btn-primary">Salvar</button>
        </div>
    </div>
</div>
<!-- POPUP RÁPIDO -->
<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

            </div>
        </section>

        <div class="no-print sticky bottom-0 z-30 -mx-4 px-4 py-3 bg-white/90 backdrop-blur border-t flex justify-center md:justify-end" style="border-color:var(--line)">
            <button onclick="gerarTurmaToda()" class="btn btn-primary w-full md:w-auto md:px-10">Gerar relatórios da turma</button>
        </div>

            </div>
            <div id="listaRelatorios" class="space-y-4"></div>
        </section>
    </div>

    <div id="view-cadastro" class="hidden">

                    <div><label class="label" for="nomeInd">Nome</label><input type="text" id="nomeInd" class="field"></div>
                    <div><label class="label" for="turmaInd">Turma (ex: 6º Ano A)</label><input type="text" id="turmaInd" class="field"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="label" for="generoInd">Gênero</label>

                        <div><label class="label" for="perfilInd">Perfil</label>

                                <option value="pouco_participativo">Pouco part.</option>
                                <option value="agitado">Agitado</option>
                                <option value="melhorar">Melhorar</option>
                            </select></div>
                    </div>
                    <button onclick="salvarIndividual()" class="btn btn-primary w-full">Salvar aluno</button>
                </div>

                <div class="card p-5 md:p-6 space-y-4">
                    <h2 class="font-display font-semibold text-lg">Lista de alunos</h2>
                    <div><label class="label" for="bulkAlunos">Nomes (um por linha)</label><textarea id="bulkAlunos" class="field"></textarea></div>
                    <div><label class="label" for="turmaBulk">Turma deste grupo</label><input type="text" id="turmaBulk" class="field"></div>

                </div>
            </div>
        </section>
    </div>
</main>

        async function carregar(manterTurma = null) {
            const { data: dataAlunos } = await sb.from('alunos').select('*').order('nome');
            alunos = dataAlunos || [];
            const { data: dataRels } = await sb.from('relatorios').select('*');
            relatoriosSalvosMap = {};

        async function salvarIndividual() {
    const nome = document.getElementById('nomeInd').value.trim();
    const turma = document.getElementById('turmaInd').value.trim();
    if (!nome || !turma) return mostrarToast('Preencha nome e turma.');
    const { error } = await sb.from('alunos').insert([{ nome, turma, genero: document.getElementById('generoInd').value, perfil: document.getElementById('perfilInd').value }]);
    if (error) return mostrarToast('Não foi possível salvar. Tente de novo.');
    document.getElementById('nomeInd').value = "";
    await carregar(turma);
    mostrarToast('Aluno cadastrado com sucesso!');
}

    const novos = texto.split('\n').filter(n => n.trim()).map(n => ({ nome: n.trim(), turma, genero: 'masc', perfil: 'participativo' }));
    const { error } = await sb.from('alunos').insert(novos);
    if (error) return mostrarToast('Não foi possível importar. Tente de novo.');
    document.getElementById('bulkAlunos').value = ""; document.getElementById('turmaBulk').value = "";
    await carregar(turma);
    mostrarToast(novos.length === 1 ? '1 aluno cadastrado com sucesso!' : `${novos.length} alunos cadastrados com sucesso!`);
}

        async function atualizarDado(id, campo, valor) {
            const aluno = alunos.find(a => a.id === id);
            if (aluno) {
                aluno[campo] = valor;
                await sb.from('alunos').update({ [campo]: valor }).eq('id', id);
                if (campo === 'turma' || campo === 'nome') await carregar(aluno.turma); else renderTabela();
            }
        }

        function abrirModalAluno(id) {
    const a = alunos.find(al => al.id === id);
    document.getElementById('modalConteudo').innerHTML = `
        <div class="relative inline-block w-full text-center">
            <img src="${a.foto_url || SEM_FOTO}" alt="Foto de ${a.nome}" class="w-44 h-44 mx-auto object-cover rounded-3xl border border-gray-200 shadow-lg">
            <label class="absolute bottom-2 right-[calc(50%-80px)] btn btn-primary btn-sm !min-h-[40px] !px-3 shadow-md" title="Trocar foto">
                Trocar foto <input type="file" accept="image/*" capture="user" class="hidden" onchange="alterarFoto(this, '${a.id}', true)">
            </label>
        </div>
        <div class="mt-5 text-left">
            <label class="label" for="mNome">Nome</label>
            <input id="mNome" type="text" value="${a.nome}" onchange="atualizarDado('${a.id}', 'nome', this.value); abrirModalAluno('${a.id}');" class="field font-semibold">

            <div class="grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="label" for="mTurma">Turma</label>
                    <input id="mTurma" type="text" value="${a.turma}" onchange="atualizarDado('${a.id}', 'turma', this.value.trim()); abrirModalAluno('${a.id}');" class="field">
                </div>
                <div>
                    <label class="label" for="mGenero">Gênero</label>
                    <select id="mGenero" onchange="atualizarDado('${a.id}', 'genero', this.value); abrirModalAluno('${a.id}');" class="field">
                        <option value="masc" ${a.genero==='masc'?'selected':''}>Masculino</option>
                        <option value="fem" ${a.genero==='fem'?'selected':''}>Feminino</option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <label class="label" for="mPerfil">Perfil</label>
                <select id="mPerfil" onchange="atualizarDado('${a.id}', 'perfil', this.value); abrirModalAluno('${a.id}');" class="field">
                    <option value="participativo" ${a.perfil==='participativo'?'selected':''}>Participativo</option>
                    <option value="pouco_participativo" ${a.perfil==='pouco_participativo'?'selected':''}>Pouco participativo</option>
                    <option value="agitado" ${a.perfil==='agitado'?'selected':''}>Agitado</option>
                    <option value="melhorar" ${a.perfil==='melhorar'?'selected':''}>Melhorar</option>
                </select>
            </div>
        </div>
    `;
    document.getElementById('modalAluno').classList.add('active');
}

        function fecharModal(e) { if (e && e.target.id === 'modalAluno') document.getElementById('modalAluno').classList.remove('active'); }
function mostrarAba(nome) {
    document.getElementById('view-alunos').classList.toggle('hidden', nome !== 'alunos');
    document.getElementById('view-cadastro').classList.toggle('hidden', nome !== 'cadastro');
    ['alunos', 'cadastro'].forEach(n => {
        const b = document.getElementById('nav-' + n);
        const ativo = n === nome;
        b.classList.toggle('bg-indigo-50', ativo);
        b.classList.toggle('text-indigo-700', ativo);
        b.setAttribute('aria-current', ativo ? 'page' : 'false');
    });
    window.scrollTo({ top: 0 });
}

// Espera a tela terminar de se reorganizar e só então rola até o relatório
function rolarAte(id) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
        const el = document.getElementById('rel-' + id);
        if (!el) return;
        const y = el.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: y, behavior: 'smooth' });
        el.classList.add('ring-4', 'ring-indigo-300');
        setTimeout(() => el.classList.remove('ring-4', 'ring-indigo-300'), 1600);
    }));
}

let toastTimer;
function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

let confirmaResolver = null;
function confirmarSite(titulo, texto) {
    return new Promise(resolve => {
        confirmaResolver = resolve;
        document.getElementById('confirmaTitulo').textContent = titulo;
        document.getElementById('confirmaTexto').textContent = texto;
        document.getElementById('modalConfirma').classList.add('active');
    });
}
function responderConfirma(ok) {
    document.getElementById('modalConfirma').classList.remove('active');
    if (confirmaResolver) { confirmaResolver(ok); confirmaResolver = null; }
}
let promptResolver = null;
function promptSite(titulo, texto, valorInicial = '') {
    return new Promise(resolve => {
        promptResolver = resolve;
        document.getElementById('promptTitulo').textContent = titulo;
        document.getElementById('promptTexto').textContent = texto;
        const input = document.getElementById('promptInput');
        input.value = valorInicial;
        document.getElementById('modalPrompt').classList.add('active');
        setTimeout(() => { input.focus(); input.select(); }, 50);
    });
}
function responderPrompt(ok) {
    const valor = document.getElementById('promptInput').value;
    document.getElementById('modalPrompt').classList.remove('active');
    if (promptResolver) { promptResolver(ok ? valor : null); promptResolver = null; }
}
function irParaRelatorio(id) {
    if (!relatoriosSalvosMap[id]) return mostrarToast('Esse aluno ainda não tem relatório. Clique em Gerar.');
    rolarAte(id);
}
        
        // Reduz a foto e salva em WebP: página e banco ficam bem mais leves
        function comprimirFoto(file) {
            return new Promise(resolve => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const escala = Math.min(1, 480 / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * escala);
                    c.height = Math.round(img.height * escala);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/webp', 0.8));
                };
                img.src = url;
            });
        }

        async function alterarFoto(input, id, doModal = false) {
            if (input.files && input.files[0]) {
                const dataUrl = await comprimirFoto(input.files[0]);
                await sb.from('alunos').update({ foto_url: dataUrl }).eq('id', id);
                const aluno = alunos.find(a => a.id === id);
                if (aluno) aluno.foto_url = dataUrl;
                if (doModal) abrirModalAluno(id);
                renderTabela();
                renderRelatorios();
            }
        }

        async function renomearTurma() {
    const novo = await promptSite('Renomear turma', `Novo nome para "${turmaAtiva}":`, turmaAtiva);
    if (novo && novo.trim() !== "") {
        const nomeLimpo = novo.trim();
        await sb.from('alunos').update({ turma: nomeLimpo }).eq('turma', turmaAtiva);
        await carregar(nomeLimpo);
    }
}

async function excluirTurma() {
    const ok = await confirmarSite('Excluir turma?', `A turma "${turmaAtiva}" e todos os seus alunos serão removidos. Essa ação não pode ser desfeita.`);
    if (!ok) return;
    await sb.from('alunos').delete().eq('turma', turmaAtiva);
    turmaAtiva = "";
    await carregar();
}

async function remover(id) {
    const a = alunos.find(al => al.id === id);
    const ok = await confirmarSite('Excluir aluno?', `${a ? a.nome : 'Este aluno'} será removido da turma. Essa ação não pode ser desfeita.`);
    if (!ok) return;
    await sb.from('alunos').delete().eq('id', id);
    await carregar(turmaAtiva);
}
        function renderTabs() {
    const container = document.getElementById('abasContainer');
    const acoes = document.getElementById('acoesTurma');
    const turmas = [...new Set(alunos.map(a => a.turma))].sort();
    if (turmas.length > 0) {
        acoes.classList.remove('hidden');
        container.innerHTML = turmas.map(t => `<button role="tab" aria-selected="${turmaAtiva === t}" onclick="turmaAtiva='${t}'; renderTabs(); renderTabela(); renderRelatorios();" class="aba ${turmaAtiva === t ? 'aba-ativa' : ''}">${t}</button>`).join('');
    } else { acoes.classList.add('hidden'); container.innerHTML = ""; }
}

        function renderTabela() {
    const tbody = document.getElementById('tabelaAlunos');
    const filtrados = alunos.filter(a => a.turma === turmaAtiva).sort((a,b) => a.nome.localeCompare(b.nome));
    if (filtrados.length === 0) { tbody.innerHTML = `<p class="p-10 text-center" style="color:var(--muted)">Nenhum aluno nesta turma. Use a aba Cadastrar.</p>`; return; }
    tbody.innerHTML = filtrados.map(a => `
        <div class="p-4 flex flex-wrap items-center gap-3 hover:bg-gray-50 transition-colors" style="border-color:var(--line)">
            <img src="${a.foto_url || SEM_FOTO}" alt="Foto de ${a.nome}" loading="lazy" onclick="abrirModalAluno('${a.id}')" class="foto-preview">
            <button onclick="abrirModalAluno('${a.id}')" class="flex-1 min-w-[140px] text-left font-semibold text-base hover:underline">${a.nome}</button>
            <div class="flex gap-2 ml-auto">
                <button onclick="irParaRelatorio('${a.id}')" class="btn btn-ghost btn-sm !px-3" aria-label="Ver relatório de ${a.nome}" title="Ver relatório">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/></svg>
                </button>
                <button onclick="gerarIndividual('${a.id}')" class="btn btn-primary btn-sm">Gerar</button>
                <button onclick="remover('${a.id}')" class="btn btn-danger btn-sm" aria-label="Excluir ${a.nome}">Excluir</button>
            </div>
        </div>
    `).join('');
}

        async function gerarIndividual(id, rolar = true) {
    const a = alunos.find(al => al.id === id);
    const opcoes = frasesLongas[a.perfil][a.genero];
    const fraseEscolhida = opcoes[Math.floor(Math.random() * opcoes.length)];
    const textoFinal = `${a.nome} ${fraseEscolhida}`;

    await sb.from('relatorios').upsert({ aluno_id: id, texto_completo: textoFinal });
    relatoriosSalvosMap[id] = textoFinal;
    renderRelatorios();
    if (rolar) rolarAte(id);
}

async function gerarTurmaToda() {
    await Promise.all(alunos.filter(a => a.turma === turmaAtiva).map(a => gerarIndividual(a.id, false)));
    const area = document.getElementById('resultadoArea');
    if (area.classList.contains('hidden')) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
        window.scrollTo({ top: area.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
    }));
}

       function renderRelatorios() {
    const area = document.getElementById('resultadoArea');
    const container = document.getElementById('listaRelatorios');

    const filtrados = alunos
        .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
        .sort((a, b) => a.nome.localeCompare(b.nome));

    const html = filtrados.map(a => {
        return `<article id="rel-${a.id}" class="flex flex-col md:flex-row items-center md:items-start gap-4 p-4 rounded-2xl border relative transition-shadow" style="background:var(--bg);border-color:var(--line)">
            <button onclick="removerRelatorio('${a.id}')" class="no-print absolute top-2 right-2 w-10 h-10 rounded-full text-gray-500 hover:bg-gray-200" aria-label="Remover relatório de ${a.nome}">✕</button>
            ${a.foto_url ? `<img src="${a.foto_url}" alt="Foto de ${a.nome}" loading="lazy" class="w-24 h-24 rounded-2xl object-cover bg-white flex-shrink-0">` : ''}
            <div class="flex-1 text-center md:text-justify"><p class="font-display font-semibold">${a.nome.toUpperCase()} (${turmaAtiva})</p><p class="text-sm mt-1 leading-relaxed" style="color:#2d3748">${relatoriosSalvosMap[a.id]}</p></div></article>`;
    }).join('');

    if (html) { area.classList.remove('hidden'); container.innerHTML = html; } else area.classList.add('hidden');
}

async function removerRelatorio(id) {
    const a = alunos.find(al => al.id === id);
    const ok = await confirmarSite('Excluir relatório?', `O relatório de ${a ? a.nome : 'este aluno'} será apagado. Você pode gerar outro depois.`);
    if (!ok) return;
    await sb.from('relatorios').delete().eq('aluno_id', id);
    delete relatoriosSalvosMap[id];
    renderRelatorios();
}
        window.onload = carregar;
    </script>
</body>
