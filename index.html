<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Educação Física</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-4 font-sans">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-lg border">
        <h1 class="text-2xl font-extrabold mb-6 border-b pb-4">Gerador de Relatórios: Ed. Física</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-gray-100 p-4 rounded-xl">
                <h2 class="font-bold mb-2">Cadastro Individual</h2>
                <input type="text" id="nomeInd" placeholder="Nome" class="w-full p-2 mb-2 border rounded">
                <input type="text" id="turmaInd" placeholder="Turma" class="w-full p-2 mb-2 border rounded">
                <select id="generoInd" class="w-full p-2 mb-2 border rounded"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
                <select id="perfilInd" class="w-full p-2 mb-2 border rounded">
                    <option value="participativo">Participativo</option><option value="pouco_participativo">Pouco participativo</option>
                    <option value="agitado">Agitado</option><option value="melhorar">Precisa melhorar</option>
                </select>
                <input type="file" id="fotoInd" accept="image/*" class="w-full p-2 mb-2 border rounded">
                <button onclick="adicionarAluno()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Salvar Aluno</button>
            </div>
            
            <div class="bg-gray-100 p-4 rounded-xl">
                <h2 class="font-bold mb-2">Importar Lista (Massa)</h2>
                <textarea id="bulkAlunos" placeholder="Cole os nomes, um por linha" class="w-full p-2 mb-2 border rounded h-20"></textarea>
                <input type="text" id="turmaBulk" placeholder="Turma padrão" class="w-full p-2 mb-2 border rounded">
                <button onclick="adicionarMassa()" class="w-full bg-green-600 text-white py-2 rounded font-bold">Importar</button>
            </div>
        </div>

        <table class="w-full text-left border-collapse">
            <thead><tr class="bg-gray-200"><th class="p-2">Nome</th><th class="p-2">Turma</th><th class="p-2">Ações</th></tr></thead>
            <tbody id="tabelaAlunos"></tbody>
        </table>
    </div>

    <script>
        // INSERIR SUAS CREDENCIAIS AQUI
        const supabase = supabase.createClient('https://pojvyniepaloewkqmwsq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvanZ5bmllcGFsb2V3a3Ftd3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjk5OTMsImV4cCI6MjEwNzYwNTk5M30.e8I9_Ks-vStABgmh6fWMA_cXhGfVOS5cyzypKcG1Exg');

        async function carregarDados() {
            const { data, error } = await supabase.from('alunos').select('*').order('nome');
            if(error) console.error("Erro ao carregar:", error);
            const tbody = document.getElementById('tabelaAlunos');
            tbody.innerHTML = '';
            (data || []).forEach(a => {
                tbody.innerHTML += `<tr><td class="p-2">${a.nome}</td><td class="p-2">${a.turma}</td><td class="p-2"><button onclick="removerAluno('${a.id}')" class="text-red-500">Excluir</button></td></tr>`;
            });
        }

        async function adicionarAluno() {
            const nome = document.getElementById('nomeInd').value;
            const turma = document.getElementById('turmaInd').value;
            const genero = document.getElementById('generoInd').value;
            const perfil = document.getElementById('perfilInd').value;
            const fotoInput = document.getElementById('fotoInd');

            let foto_url = "";
            if (fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    await supabase.from('alunos').insert([{ nome, turma, genero, perfil, foto_url: e.target.result }]);
                    carregarDados();
                };
                reader.readAsDataURL(fotoInput.files[0]);
            } else {
                await supabase.from('alunos').insert([{ nome, turma, genero, perfil, foto_url }]);
                carregarDados();
            }
        }

        async function adicionarMassa() {
            const nomes = document.getElementById('bulkAlunos').value.split('\n');
            const turma = document.getElementById('turmaBulk').value;
            const novos = nomes.filter(n => n.trim()).map(nome => ({ nome: nome.trim(), turma, genero: 'masc', perfil: 'participativo' }));
            await supabase.from('alunos').insert(novos);
            carregarDados();
        }

        async function removerAluno(id) {
            await supabase.from('alunos').delete().eq('id', id);
            carregarDados();
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
