<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Relatórios Educação Física</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @media print { .no-print { display: none; } }
        .aba-ativa { border-bottom: 3px solid #4f46e5; font-weight: bold; color: #4f46e5; }
        .foto-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 2px solid #e2e8f0; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-50 p-2 md:p-6 font-sans">

    <div class="max-w-5xl mx-auto bg-white p-4 md:p-6 rounded-2xl shadow-xl border no-print">
        <h1 class="text-2xl font-black mb-6 text-gray-800 border-b pb-4">Gerador de Relatórios: Ed. Física</h1>

        <!-- PAINEL DE CADASTRO -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                <h2 class="font-bold text-indigo-900 mb-4">Cadastro Individual</h2>
                <div class="space-y-3">
                    <input type="text" id="nomeInd" placeholder="Nome do Aluno" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
                    <input type="text" id="turmaInd" placeholder="Turma (ex: 6º Ano A)" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="generoInd" class="p-2 border rounded-lg bg-white">
                            <option value="masc">Masculino</option>
                            <option value="fem">Feminino</option>
                        </select>
                        <select id="perfilInd" class="p-2 border rounded-lg bg-white">
                            <option value="participativo">Participativo</option>
                            <option value="pouco_participativo">Pouco participativo</option>
                            <option value="agitado">Agitado</option>
                            <option value="melhorar">Precisa melhorar</option>
                        </select>
                    </div>
                    <button onclick="salvarIndividual()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition">Salvar Aluno</button>
                </div>
            </div>
            
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                <h2 class="font-bold text-emerald-900 mb-4">Importar Lista (Massa)</h2>
                <textarea id="bulkAlunos" placeholder="Nomes (um por linha)" class="w-full p-2 border rounded-lg h-20 mb-2 outline-none focus:ring-2 focus:ring-emerald-400"></textarea>
                <input type="text" id="turmaBulk" placeholder="Turma para este lote" class="w-full p-2 border rounded-lg mb-2">
                <button onclick="salvarMassa()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition">Importar Todos</button>
            </div>
        </div>

        <div id="abasContainer" class="flex gap-4 mb-4 overflow-x-auto border-b"></div>
        <div class="overflow-x-auto rounded-lg border">
            <table class="w-full text-left bg-white">
                <thead class="bg-gray-100 text-gray-600 text-xs uppercase">
                    <tr>
                        <th class="p-3">Foto</th>
                        <th class="p-3">Nome</th>
                        <th class="p-3 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAlunos" class="divide-y text-sm"></tbody>
            </table>
        </div>
        
        <div class="mt-6 flex justify-end">
            <button onclick="gerarTurmaToda()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg">Gerar Relatórios da Turma</button>
        </div>
    </div>

    <div id="resultadoArea" class="max-w-4xl mx-auto mt-8 p-6 bg-white rounded-2xl shadow-lg border hidden print:block print:mt-0">
        <div class="flex justify-between items-center mb-6 no-print">
            <h2 class="text-xl font-bold text-gray-800">Relatórios Gerados</h2>
            <button onclick="window.print()" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold">Imprimir / PDF</button>
        </div>
        <div id="listaRelatorios" class="space-y-6"></div>
    </div>

    <script>
        // LIMPANDO AS CHAVES PARA EVITAR O ERRO DE HEADERS
        const rawUrl = 'https://pojvyniepaloewkqmwsq.supabase.co';
        const rawKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvanZ5bmllcGFsb2V3a3Ftd3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjk5OTMsImV4cCI6MjEwNzYwNTk5M30.e8I9_Ks-vStABgmh6fWMA_cXhGfVOS5cyzypKcG1Exg';
        
        const supabaseUrl = rawUrl.trim();
        const supabaseKey = rawKey.trim();
        const sb = supabase.createClient(supabaseUrl, supabaseKey);

        let alunos = [];
        let turmaAtiva = "";
        let relatoriosNaTela = {};

        const frasesLongas = {
            participativo: { masc: "demonstra um excelente engajamento nas aulas. Participa com entusiasmo de todas as atividades, exibindo um desenvolvimento motor adequado. Valoriza o espírito de equipe e colabora ativamente, respeitando as regras dos jogos.", fem: "demonstra um excelente engajamento nas aulas. Participa com entusiasmo de todas as atividades, exibindo um desenvolvimento motor adequado. Valoriza o espírito de equipe e colabora ativamente, respeitando as regras dos jogos." },
            pouco_participativo: { masc: "nas práticas, tem se mostrado um aluno observador e cauteloso. Incentivamos sua interação nos jogos, respeitando seu tempo. Notamos crescimento na sua confiança, seguindo o trabalho para que se sinta seguro para explorar suas potencialidades junto ao grupo.", fem: "nas práticas, tem se mostrado uma aluna observadora e cautelosa. Incentivamos sua interação nos jogos, respeitando seu tempo. Notamos crescimento na sua confiança, seguindo o trabalho para que se sinta segura para explorar suas potencialidades junto ao grupo." },
            agitado: { masc: "possui uma energia contagiante e muita criatividade, o que enriquece nossas aulas. Trabalhamos diariamente para direcionar esse potencial para a execução técnica e o foco nas regras dos jogos. É gratificante observar como direciona essa vivacidade para superar desafios.", fem: "possui uma energia contagiante e muita criatividade, o que enriquece nossas aulas. Trabalhamos diariamente para direcionar esse potencial para a execução técnica e o foco nas regras dos jogos. É gratificante observar como direciona essa vivacidade para superar desafios." },
            melhorar: { masc: "tem se dedicado com esforço em suas atividades práticas. Focamos em fortalecer sua coordenação motora e confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família, seguimos caminhando para conquistas importantes no desenvolvimento de suas habilidades.", fem: "tem se dedicado com esforço em suas atividades práticas. Focamos em fortalecer sua coordenação motora e confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família, seguimos caminhando para conquistas importantes no desenvolvimento de suas habilidades." }
        };

        async function carregar() {
            const { data, error } = await sb.from('alunos').select('*').order('nome');
            if (error) { console.error("Erro Supabase:", error); return; }
            alunos = data || [];
            if (alunos.length > 0 && !turmaAtiva) turmaAtiva = alunos[0].turma;
            renderTabs();
            renderTabela();
            renderRelatorios();
        }

        async function salvarIndividual() {
            const nome = document.getElementById('nomeInd').value.trim();
            const turma = document.getElementById('turmaInd').value.trim();
            if (!nome || !turma) return alert("Preencha Nome e Turma!");

            const novo = { nome, turma, genero: document.getElementById('generoInd').value, perfil: document.getElementById('perfilInd').value, foto_url: "" };
            const { error } = await sb.from('alunos').insert([novo]);
            if (error) return alert("Erro ao salvar: " + error.message);
            
            document.getElementById('nomeInd').value = "";
            carregar();
        }

        async function salvarMassa() {
            const texto = document.getElementById('bulkAlunos').value.trim();
            const turma = document.getElementById('turmaBulk').value.trim();
            if (!texto || !turma) return alert("Preencha a lista e a turma!");

            const novos = texto.split('\n').filter(n => n.trim()).map(n => ({ nome: n.trim(), turma, genero: 'masc', perfil: 'participativo' }));
            const { error } = await sb.from('alunos').insert(novos);
            if (error) return alert("Erro: " + error.message);

            document.getElementById('bulkAlunos').value = "";
            carregar();
        }

        async function alterarFoto(input, id) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const { error } = await sb.from('alunos').update({ foto_url: e.target.result }).eq('id', id);
                    if (error) alert("Erro na foto: " + error.message);
                    carregar();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function remover(id) {
            if (!confirm("Excluir este aluno?")) return;
            await sb.from('alunos').delete().eq('id', id);
            delete relatoriosNaTela[id];
            carregar();
        }

        function renderTabs() {
            const container = document.getElementById('abasContainer');
            const turmas = [...new Set(alunos.map(a => a.turma))].sort();
            container.innerHTML = turmas.map(t => `<button onclick="mudarTurma('${t}')" class="pb-2 px-4 text-sm ${turmaAtiva === t ? 'aba-ativa' : 'text-gray-400'}">${t}</button>`).join('');
        }

        function mudarTurma(t) {
            turmaAtiva = t;
            renderTabs();
            renderTabela();
            renderRelatorios();
        }

        function renderTabela() {
            const tbody = document.getElementById('tabelaAlunos');
            const filtrados = alunos.filter(a => a.turma === turmaAtiva);
            tbody.innerHTML = filtrados.map(a => `
                <tr class="hover:bg-gray-50 border-b">
                    <td class="p-3">
                        <label class="block w-12 h-12 relative">
                            <img src="${a.foto_url || 'https://via.placeholder.com/50'}" class="foto-preview">
                            <input type="file" accept="image/*" capture="user" class="hidden" onchange="alterarFoto(this, '${a.id}')">
                        </label>
                    </td>
                    <td class="p-3 font-bold text-gray-700">${a.nome}</td>
                    <td class="p-3 flex justify-center gap-2">
                        <button onclick="gerarIndividual('${a.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs font-bold">GERAR</button>
                        <button onclick="remover('${a.id}')" class="text-red-500">✕</button>
                    </td>
                </tr>
            `).join('');
        }

        function gerarIndividual(id) {
            const a = alunos.find(al => al.id === id);
            const texto = frasesLongas[a.perfil][a.genero];
            relatoriosNaTela[id] = `
                <div class="flex gap-4 p-4 bg-gray-50 rounded-xl border-l-8 border-indigo-500 relative">
                    <button onclick="removerRelatorio('${id}')" class="no-print absolute top-2 right-2 text-gray-400">✕</button>
                    ${a.foto_url ? `<img src="${a.foto_url}" class="w-20 h-20 rounded-lg object-cover">` : ''}
                    <div>
                        <p class="font-bold text-gray-800">${a.nome.toUpperCase()} (${a.turma})</p>
                        <p class="text-gray-700 text-sm mt-1">${a.nome} ${texto}</p>
                    </div>
                </div>
            `;
            renderRelatorios();
        }

        function gerarTurmaToda() {
            alunos.filter(a => a.turma === turmaAtiva).forEach(a => gerarIndividual(a.id));
        }

        function removerRelatorio(id) { delete relatoriosNaTela[id]; renderRelatorios(); }

        function renderRelatorios() {
            const area = document.getElementById('resultadoArea');
            const container = document.getElementById('listaRelatorios');
            const idsAtivos = alunos.filter(a => a.turma === turmaAtiva).map(a => a.id);
            const html = Object.keys(relatoriosNaTela).filter(id => idsAtivos.includes(id)).map(id => relatoriosNaTela[id]).join('');
            if (html) { area.classList.remove('hidden'); container.innerHTML = html; } else { area.classList.add('hidden'); }
        }

        window.onload = carregar;
    </script>
</body>
</html>
