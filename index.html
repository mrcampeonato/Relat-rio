<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatórios Educação Física</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { .no-print { display: none; } }
        .foto-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 2px solid #e2e8f0; cursor: pointer; transition: all 0.2s; }
        .aba-ativa { border-bottom: 3px solid #4f46e5; font-weight: bold; color: #4f46e5; }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow-xl border border-gray-100 no-print">
        <h1 class="text-3xl font-extrabold mb-8 text-gray-800 border-b pb-4">Gerador de Relatórios: Ed. Física</h1>

        <!-- PAINEL DE ADIÇÃO -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-bold text-indigo-800 mb-4">👤 Cadastro Individual</h2>
                <div class="space-y-3">
                    <input type="text" id="nomeInd" placeholder="Nome Completo do Aluno" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                    <input type="text" id="turmaInd" placeholder="Turma (ex: 6º Ano A)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="generoInd" class="p-2.5 border rounded-lg bg-white outline-none"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
                        <select id="perfilInd" class="p-2.5 border rounded-lg bg-white outline-none">
                            <option value="participativo">Participativo</option><option value="pouco_participativo">Pouco participativo</option>
                            <option value="agitado">Agitado</option><option value="melhorar">Precisa melhorar</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-sm text-indigo-700 font-medium">Foto (Webcam/Arq):</label>
                        <input type="file" id="fotoInd" accept="image/*" capture="user" class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-600 file:text-white cursor-pointer">
                    </div>
                    <button onclick="adicionarAluno()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">Salvar Aluno</button>
                </div>
            </div>
            
            <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-100">
                <h2 class="font-bold text-emerald-800 mb-4">📑 Importar Lista (Massa)</h2>
                <textarea id="bulkAlunos" placeholder="Cole os nomes dos alunos aqui, um por linha..." class="w-full p-2.5 border rounded-lg h-28 mb-3 outline-none"></textarea>
                <input type="text" id="turmaBulk" placeholder="Qual a turma destes alunos?" class="w-full p-2.5 border rounded-lg mb-3 outline-none">
                <button onclick="adicionarMassa()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition">Importar Todos</button>
            </div>
        </div>

        <div id="abasContainer" class="flex gap-4 mb-2 overflow-x-auto border-b pb-2"></div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                    <tr><th class="p-4">Foto</th><th class="p-4">Nome</th><th class="p-4">Gên</th><th class="p-4">Perfil</th><th class="p-4 text-center">Ações</th></tr>
                </thead>
                <tbody id="tabelaAlunos" class="divide-y text-sm"></tbody>
            </table>
        </div>
        
        <div class="mt-6 flex justify-end">
            <button onclick="gerarTurmaToda()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200">Gerar Relatórios da Turma Atual</button>
        </div>
    </div>

    <!-- ÁREA DE IMPRESSÃO / RESULTADOS -->
    <div id="resultado" class="max-w-4xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-lg border">
        <div class="flex justify-between items-center mb-8 no-print border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-800">Relatórios Gerados</h2>
            <button onclick="window.print()" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold no-print">Imprimir / PDF</button>
        </div>
        <div id="listaRelatorios" class="space-y-8"></div>
    </div>

    <script>
        let alunos = [];
        let turmaAtiva = "";
        let relatoriosSalvos = {};

        const frasesLongas = {
            participativo: { masc: "Demonstra um excelente engajamento nas aulas. Participa com entusiasmo de todas as atividades, exibindo um desenvolvimento motor adequado. Valoriza o espírito de equipe e colabora ativamente, respeitando as regras dos jogos.", fem: "Demonstra um excelente engajamento nas aulas. Participa com entusiasmo de todas as atividades, exibindo um desenvolvimento motor adequado. Valoriza o espírito de equipe e colabora ativamente, respeitando as regras dos jogos." },
            pouco_participativo: { masc: "Nas práticas, tem se mostrado um aluno observador e cauteloso. Incentivamos sua interação nos jogos, respeitando seu tempo. Notamos crescimento na sua confiança, seguindo o trabalho para que se sinta seguro para explorar suas potencialidades junto ao grupo.", fem: "Nas práticas, tem se mostrado uma aluna observadora e cautelosa. Incentivamos sua interação nos jogos, respeitando seu tempo. Notamos crescimento na sua confiança, seguindo o trabalho para que se sinta segura para explorar suas potencialidades junto ao grupo." },
            agitado: { masc: "Possui uma energia contagiante e muita criatividade, o que enriquece nossas aulas. Trabalhamos diariamente para direcionar esse potencial para a execução técnica e o foco nas regras dos jogos. É gratificante observar como direciona essa vivacidade para superar desafios.", fem: "Possui uma energia contagiante e muita criatividade, o que enriquece nossas aulas. Trabalhamos diariamente para direcionar esse potencial para a execução técnica e o foco nas regras dos jogos. É gratificante observar como direciona essa vivacidade para superar desafios." },
            melhorar: { masc: "Tem se dedicado com esforço em suas atividades práticas. Focamos em fortalecer sua coordenação motora e confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família, seguimos caminhando para conquistas importantes no desenvolvimento de suas habilidades.", fem: "Tem se dedicado com esforço em suas atividades práticas. Focamos em fortalecer sua coordenação motora e confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família, seguimos caminhando para conquistas importantes no desenvolvimento de suas habilidades." }
        };

        function adicionarAluno() {
            const nome = document.getElementById("nomeInd").value;
            const turma = document.getElementById("turmaInd").value;
            if(!nome || !turma) return alert("Preencha nome e turma!");

            const fotoInput = document.getElementById("fotoInd");
            if (fotoInput.files && fotoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = e => finalizarCadastro(nome, turma, e.target.result);
                reader.readAsDataURL(fotoInput.files[0]);
            } else { finalizarCadastro(nome, turma, ""); }
        }

        function finalizarCadastro(nome, turma, foto) {
            alunos.push({ id: Date.now() + Math.random(), nome, turma, foto, genero: document.getElementById("generoInd").value, perfil: document.getElementById("perfilInd").value });
            turmaAtiva = turma;
            atualizarInterface();
        }

        function adicionarMassa() {
            const bulkText = document.getElementById("bulkAlunos").value;
            const turma = document.getElementById("turmaBulk").value;
            if(!bulkText || !turma) return alert("Preencha os campos!");
            bulkText.split('\n').forEach(n => {
                if(n.trim()) alunos.push({ id: Date.now() + Math.random(), nome: n.trim(), turma, genero: 'masc', perfil: 'participativo', foto: "" });
            });
            turmaAtiva = turma;
            atualizarInterface();
        }

        function atualizarInterface() {
            const containerAbas = document.getElementById("abasContainer");
            const turmas = [...new Set(alunos.map(a => a.turma))].sort();
            if(!turmaAtiva && turmas.length > 0) turmaAtiva = turmas[0];
            
            containerAbas.innerHTML = turmas.map(t => `<button onclick="mudarTurma('${t}')" class="pb-2 px-4 text-sm transition ${turmaAtiva === t ? 'aba-ativa' : 'text-gray-400 hover:text-gray-600'}">${t}</button>`).join('');

            const tbody = document.getElementById("tabelaAlunos");
            tbody.innerHTML = alunos.filter(a => a.turma === turmaAtiva).sort((a,b) => a.nome.localeCompare(b.nome)).map(a => `
                <tr>
                    <td class="p-4"><label><img src="${a.foto || 'https://via.placeholder.com/60?text=+'}" class="foto-preview"><input type="file" class="hidden" accept="image/*" capture="user" onchange="trocarFoto(this, ${a.id})"></label></td>
                    <td class="p-4 font-bold text-gray-700">${a.nome}</td>
                    <td class="p-4"><select onchange="mudarDado(${a.id}, 'genero', this.value)" class="p-1 border rounded bg-white"><option value="masc" ${a.genero==='masc'?'selected':''}>Masc</option><option value="fem" ${a.genero==='fem'?'selected':''}>Fem</option></select></td>
                    <td class="p-4"><select onchange="mudarDado(${a.id}, 'perfil', this.value)" class="p-1 border rounded bg-white w-full">${Object.keys(frasesLongas).map(p => `<option value="${p}" ${a.perfil===p?'selected':''}>${p.replace('_',' ')}</option>`).join('')}</select></td>
                    <td class="p-4 text-center space-x-2">
                        <button onclick="gerarIndividual(${a.id})" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">GERAR</button>
                        <button onclick="removerAluno(${a.id})" class="text-red-500 hover:bg-red-50 p-1.5 rounded">✕</button>
                    </td>
                </tr>
            `).join('');
        }

        function mudarDado(id, campo, valor) { alunos.find(a => a.id === id)[campo] = valor; }
        function mudarTurma(t) { turmaAtiva = t; atualizarInterface(); }
        function trocarFoto(input, id) {
            const reader = new FileReader();
            reader.onload = e => { alunos.find(a => a.id === id).foto = e.target.result; atualizarInterface(); atualizarRelatorios(); };
            reader.readAsDataURL(input.files[0]);
        }

        function gerarIndividual(id) {
            const a = alunos.find(al => al.id === id);
            relatoriosSalvos[id] = `
                <div id="rel-${id}" class="flex flex-col md:flex-row gap-6 p-6 bg-gray-50 rounded-2xl border-l-8 border-indigo-500 relative">
                    <button onclick="delete relatoriosSalvos[${id}]; atualizarRelatorios()" class="no-print absolute top-4 right-4 text-gray-300 hover:text-red-500">✕ Remover</button>
                    ${a.foto ? `<img src="${a.foto}" class="w-32 h-32 rounded-xl object-cover shadow-md">` : ''}
                    <div class="flex-1">
                        <h4 class="text-lg font-black text-indigo-900 mb-2">${a.nome.toUpperCase()}</h4>
                        <p class="text-xs font-bold text-gray-400 mb-4 tracking-widest uppercase">${a.turma}</p>
                        <p class="text-gray-700 leading-relaxed text-justify">${a.genero==='masc'?'O aluno':'A aluna'} ${frasesLongas[a.perfil][a.genero]}</p>
                    </div>
                </div>
            `;
            atualizarRelatorios();
        }

        function gerarTurmaToda() { alunos.filter(a => a.turma === turmaAtiva).forEach(a => gerarIndividual(a.id)); }

        function atualizarRelatorios() {
            const container = document.getElementById("listaRelatorios");
            // Filtra os IDs que pertencem à turma ativa e ordena
            const idsTurmaAtiva = alunos.filter(a => a.turma === turmaAtiva).map(a => a.id);
            container.innerHTML = Object.keys(relatoriosSalvos)
                .filter(id => idsTurmaAtiva.includes(parseFloat(id)))
                .map(id => relatoriosSalvos[id]).join('');
        }

        function removerAluno(id) { delete relatoriosSalvos[id]; alunos = alunos.filter(a => a.id !== id); atualizarInterface(); atualizarRelatorios(); }
    </script>
</body>
</html>
