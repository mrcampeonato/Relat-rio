<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Educação Física</title>

    <!-- Configurações PWA -->
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2955/2955485.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2955/2955485.png">

    <!-- Fontes: Poppins (títulos) + Inter (textos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Poppins', 'Inter', 'sans-serif'] } } } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root { --ink:#14213d; --muted:#556072; --line:#e6e9f0; --bg:#f6f7fb; --brand:#4f46e5; --brand-d:#4338ca; }
        html { scroll-behavior: smooth; scroll-padding-top: 76px; }
        body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Poppins', 'Inter', sans-serif; }

        /* Botões e campos */
        .btn { min-height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(79,70,229,.55); }
        .btn-primary:hover { background: var(--brand-d); }
        .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { background: #f1f3f9; }
        .btn-danger { background: #fff; color: #b42318; border: 1px solid #f3c9c5; }
        .btn-danger:hover { background: #fdf0ef; }
        .btn-sm { min-height: 40px; padding: 0 14px; font-size: 13px; }
        .field { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; color: var(--ink); }
        textarea.field { padding: 10px 12px; min-height: 96px; }
        .field-sm { min-height: 40px; font-size: 13px; }
        .label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        :focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
        .field:focus { border-color: var(--brand); outline: 3px solid #c7d2fe; outline-offset: 0; }

        /* Cartões e abas */
        .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; }
        .aba { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); background: #fff; border: 1px solid var(--line); transition: background-color .15s ease, color .15s ease; }
        .aba:hover { background: #eef0fb; }
        .aba-ativa { background: var(--ink); color: #fff; border-color: var(--ink); }
        .aba-ativa:hover { background: var(--ink); }

        .foto-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 16px; border: 1px solid var(--line); cursor: pointer; transition: transform .15s ease; flex-shrink: 0; }
        @media (min-width: 640px) { .foto-preview { width: 52px; height: 52px; border-radius: 14px; } }
        .foto-preview:hover { transform: scale(1.05); }

        /* Lista de seleção própria do site */
        select.cs-oculto { display: none !important; }
        .cs { position: relative; width: 100%; }
        .cs-btn { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; cursor: pointer; }
        .cs-btn.cs-sm { min-height: 40px; font-size: 13px; }
        .cs-btn:focus-visible, .cs-btn[aria-expanded="true"] { border-color: var(--brand); outline: 3px solid #c7d2fe; outline-offset: 0; }
        .cs-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cs-vazio { color: var(--muted); }
        .cs-lista { position: fixed; z-index: 80; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 34px -12px rgba(20,33,61,.35); padding: 6px; overflow-y: auto; }
        .cs-op { display: flex; width: 100%; min-height: 44px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; border-radius: 10px; font-size: 14px; text-align: left; white-space: nowrap; cursor: pointer; color: var(--ink); background: transparent; }
        .cs-op > span { flex: 1; text-align: left; }
        .cs-op:hover, .cs-op:focus-visible { background: #eef0fb; outline: none; }
        .cs-op[aria-selected="true"] { background: #eef0fb; color: var(--brand-d); font-weight: 600; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(20,33,61,.6); z-index: 50; align-items: flex-end; justify-content: center; padding: 0; }
        .modal.active { display: flex; }
        .modal-box { animation: subir .2s ease-out; }
        @keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (min-width: 640px) { .modal { align-items: center; padding: 20px; } }

        /* Popup rápido de confirmação */
        .toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 16px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 70; box-shadow: 0 10px 30px -10px rgba(20,33,61,.5); max-width: calc(100vw - 32px); text-align: center; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

        /* INÍCIO TOPO */
        .btn-topo { position: fixed; right: 16px; bottom: 88px; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px -8px rgba(20,33,61,.35); display: grid; place-items: center; cursor: pointer; z-index: 35; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s ease, transform .2s ease, background-color .15s ease; }
        .btn-topo.show { opacity: .85; transform: none; pointer-events: auto; }
        .btn-topo:hover { opacity: 1; background: #fff; }
        /* FIM TOPO */

        /* Folha usada para gerar os PDFs (fica fora da tela) */
        #pdfRender { position: absolute; left: -10000px; top: 0; width: 210mm; }
        #pdfRender .folha { position: relative; width: 210mm; height: 297mm; padding: 24mm 20mm 20mm; box-sizing: border-box; overflow: hidden; font-family: Arial, Helvetica, sans-serif; font-size: 12pt; color: #000; background: #fff; }
        #pdfRender .folha .timbrado { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
        #pdfRender .folha .conteudo { position: relative; z-index: 1; }
        #pdfRender .folha p { margin: 0 0 3.8mm; line-height: 1.15; }
        #pdfRender .rt { text-align: center; font-weight: 700; }
        #pdfRender .rg { display: grid; grid-template-columns: var(--c) 1fr; }
        #pdfRender .rj { text-align: justify; }
        #pdfRender .ri { font-weight: 700; margin-bottom: 1.2mm !important; }
        #pdfRender .rh { font-weight: 700; margin-bottom: 1mm !important; }
        #pdfRender .rh1 { margin-top: 6mm !important; }
        #pdfRender .rx { font-size: 10pt; line-height: 1.3 !important; text-align: justify; min-height: 15mm; margin-bottom: 3mm !important; }
        #pdfRender .rxo { min-height: 14mm; }

        @media print { .no-print { display: none !important; } body { background: #fff; } }
        #folhaImpressao { display: none; }
        @media print {
            @page { size: A4; margin: 0; }
            body > *:not(#folhaImpressao) { display: none !important; }
            #folhaImpressao { display: block; }
            .folha { position: relative; width: 210mm; height: 297mm; padding: 24mm 20mm 20mm; box-sizing: border-box; overflow: hidden; break-after: page; page-break-after: always; font-family: Arial, Helvetica, sans-serif; font-size: 12pt; color: #000; }
            .folha:last-child { break-after: auto; page-break-after: auto; }
            .folha .timbrado { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
            .folha .conteudo { position: relative; z-index: 1; }
            .folha p { margin: 0 0 3.8mm; line-height: 1.15; }
            .rt { text-align: center; font-weight: 700; }
            .rg { display: grid; grid-template-columns: var(--c) 1fr; }
            .rj { text-align: justify; }
            .ri { font-weight: 700; margin-bottom: 1.2mm !important; }
            .rh { font-weight: 700; margin-bottom: 1mm !important; }
            .rh1 { margin-top: 6mm !important; }
            .rx { font-size: 10pt; line-height: 1.3 !important; text-align: justify; min-height: 15mm; margin-bottom: 3mm !important; }
            .rxo { min-height: 14mm; }
        }
    </style>
</head>
<body>
<!-- INÍCIO LOGIN -->
<div id="telaLogin" class="no-print fixed inset-0 grid place-items-center p-4" style="z-index:100; background:var(--bg)" role="dialog" aria-modal="true" aria-labelledby="loginTitulo">
    <div class="card w-full max-w-sm p-6 md:p-8 space-y-4 shadow-xl">
        <div>
            <h1 id="loginTitulo" class="font-display font-bold text-2xl">Ed. Física</h1>
            <p class="mt-1 text-sm" style="color:var(--muted)">Entre para acessar seus relatórios.</p>
        </div>
        <div>
            <label class="label" for="loginEmail">E-mail</label>
            <input id="loginEmail" type="email" class="field" autocomplete="username" onkeydown="if (event.key === 'Enter') document.getElementById('loginSenha').focus()">
        </div>
        <div>
            <label class="label" for="loginSenha">Senha</label>
            <input id="loginSenha" type="password" class="field" autocomplete="current-password" onkeydown="if (event.key === 'Enter') entrar()">
        </div>
        <p id="loginErro" class="text-sm min-h-[20px]" style="color:#b42318" role="alert"></p>
        <button id="loginBtn" onclick="entrar()" class="btn btn-primary w-full">Entrar</button>
    </div>
</div>
<!-- FIM LOGIN -->

<!-- MODAL DE DETALHES -->
<div id="modalAluno" class="modal no-print" onclick="fecharModal(event)" role="dialog" aria-modal="true" aria-label="Detalhes do aluno">
    <div class="modal-box bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <div id="modalConteudo"></div>
        <button onclick="document.getElementById('modalAluno').classList.remove('active')" class="btn btn-primary w-full mt-6">Fechar e salvar</button>
    </div>
</div>

<!-- CONFIRMAÇÃO DE EXCLUSÃO (do site) -->
<div id="modalConfirma" class="modal no-print" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTitulo" onclick="if (event.target === this) responderConfirma(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="confirmaTitulo" class="font-display font-semibold text-xl"></h2>
        <p id="confirmaTexto" class="mt-2 text-sm" style="color:var(--muted)"></p>
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderConfirma(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderConfirma(true)" class="btn btn-danger">Excluir</button>
        </div>
    </div>
</div>

<!-- JANELA DE TEXTO (renomear turma) -->
<div id="modalPrompt" class="modal no-print" role="dialog" aria-modal="true" aria-labelledby="promptTitulo" onclick="if (event.target === this) responderPrompt(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="promptTitulo" class="font-display font-semibold text-xl"></h2>
        <label for="promptInput" id="promptTexto" class="label mt-3"></label>
        <input id="promptInput" type="text" class="field" onkeydown="if (event.key === 'Enter') responderPrompt(true); if (event.key === 'Escape') responderPrompt(false);">
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderPrompt(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderPrompt(true)" class="btn btn-primary">Salvar</button>
        </div>
    </div>
</div>

<!-- INÍCIO TOPO -->
<button id="btnTopo" class="btn-topo no-print" onclick="voltarAoTopo()" aria-label="Voltar ao topo" title="Voltar ao topo">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>
</button>
<!-- FIM TOPO -->

<!-- POPUP RÁPIDO -->
<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

<!-- CABEÇALHO / MENU -->
<header class="no-print sticky top-0 z-40 bg-white/90 backdrop-blur border-b" style="border-color:var(--line)">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
        <a href="#" onclick="mostrarAba('alunos'); return false;" class="font-display font-bold text-lg" style="color:var(--ink)">Ed. Física</a>
        <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Principal">
            <button id="nav-alunos" onclick="mostrarAba('alunos')" aria-current="page" class="px-4 min-h-[40px] rounded-lg hover:bg-gray-100 bg-indigo-50 text-indigo-700">Alunos</button>
            <button id="nav-cadastro" onclick="mostrarAba('cadastro')" class="px-4 min-h-[40px] rounded-lg hover:bg-gray-100">Cadastrar</button>
            <button onclick="sair()" class="px-4 min-h-[40px] rounded-lg hover:bg-gray-100 text-gray-500">Sair</button>
        </nav>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 md:py-12">

    <!-- AMBIENTE 1: ALUNOS + RELATÓRIOS -->
    <div id="view-alunos" class="space-y-12">

        <section id="alunos" class="no-print">
            <h1 class="font-display font-bold text-3xl md:text-4xl leading-tight">Relatórios de Educação Física</h1>
            <p class="mt-2 text-base max-w-xl" style="color:var(--muted)">Escolha a turma, ajuste gênero e perfis de cada aluno e gere os relatórios.</p>

            <div id="abasContainer" class="flex gap-2 mt-8 overflow-x-auto pb-2" role="tablist"></div>
            <div id="acoesTurma" class="flex gap-2 mt-3 hidden">
                <button onclick="renomearTurma()" class="btn btn-ghost btn-sm">Renomear turma</button>
                <button onclick="excluirTurma()" class="btn btn-danger btn-sm">Excluir turma</button>
            </div>

            <div class="card mt-4 overflow-hidden">
                <div id="tabelaAlunos" class="divide-y" style="--tw-divide-opacity:1"></div>
            </div>
        </section>

        <!-- Botão de ação sempre visível -->
        <div class="no-print sticky bottom-0 z-30 -mx-4 px-4 py-3 bg-white/90 backdrop-blur border-t flex gap-2 justify-center md:justify-end" style="border-color:var(--line)">
            <button onclick="irParaPrimeiroRelatorio()" class="btn btn-ghost flex-1 md:flex-none md:px-6">Ir para relatórios</button>
            <button id="btnConfig" onclick="alternarConfigRapida()" aria-pressed="false" class="btn btn-ghost flex-1 md:flex-none !px-3 md:!px-6">Config. rápida</button>
            <button onclick="gerarTurmaToda()" class="btn btn-primary flex-[2] md:flex-none md:px-10">Gerar relatórios da turma</button>
        </div>

        <!-- RESULTADOS -->
        <section id="resultadoArea" class="card p-5 md:p-8 hidden print:block print:border-0">
            <div class="flex justify-between items-center gap-4 mb-6 no-print">
                <h2 class="font-display font-semibold text-2xl">Relatórios gerados</h2>
                <div class="flex gap-2">
                    <button onclick="copiarRelatorios()" class="btn btn-ghost">Copiar</button>
                    <button id="btnPdf" onclick="baixarPDFs()" class="btn btn-primary">Baixar PDFs</button>
                    <button onclick="imprimirRelatorios()" class="btn btn-ghost">Imprimir</button>
                </div>
            </div>
            <div id="listaRelatorios" class="space-y-4"></div>
        </section>
    </div>

    <!-- AMBIENTE 2: CADASTRO -->
    <div id="view-cadastro" class="hidden">
        <section id="cadastro" class="no-print">
            <h1 class="font-display font-bold text-3xl md:text-4xl leading-tight">Cadastrar alunos</h1>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                <div class="card p-5 md:p-6 space-y-4">
                    <h2 class="font-display font-semibold text-lg">Um aluno</h2>
                    <div><label class="label" for="nomeInd">Nome</label><input type="text" id="nomeInd" class="field" oninput="document.getElementById('generoInd').value = inferirGenero(this.value)"></div>
                    <div><label class="label" for="turmaInd">Turma (ex: 6º Ano A)</label><input type="text" id="turmaInd" class="field"></div>
                    <div>
                        <label class="label" for="generoInd">Gênero</label>
                        <select id="generoInd" class="field"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
                    </div>
                    <div>
                        <label class="label" for="perfilInd">Perfil pedagógico</label>
                        <select id="perfilInd" class="field"></select>
                    </div>
                    <div>
                        <label class="label" for="perfilCompInd">Perfil comportamental e emocional</label>
                        <select id="perfilCompInd" class="field"></select>
                    </div>
                    <button onclick="salvarIndividual()" class="btn btn-primary w-full">Salvar aluno</button>
                </div>

                <div class="card p-5 md:p-6 space-y-4">
                    <h2 class="font-display font-semibold text-lg">Lista de alunos</h2>
                    <div><label class="label" for="bulkAlunos">Nomes (um por linha)</label><textarea id="bulkAlunos" class="field"></textarea></div>
                    <div><label class="label" for="turmaBulk">Turma deste grupo</label><input type="text" id="turmaBulk" class="field"></div>
                    <button onclick="salvarMassa()" class="btn btn-ghost w-full">Importar todos</button>
                </div>
            </div>
        </section>
    </div>
</main>
<div id="folhaImpressao"></div>
<div id="pdfRender" class="no-print" aria-hidden="true"></div>

<script>
    const SUPABASE_URL = 'https://pojvyniepaloewkqmwsq.supabase.co'.trim();
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvanZ5bmllcGFsb2V3a3Ftd3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMjk5OTMsImV4cCI6MjEwNzYwNTk5M30.e8I9_Ks-vStABgmh6fWMA_cXhGfVOS5cyzypKcG1Exg'.trim();
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let alunos = [];
    let turmaAtiva = "";
    let relatoriosSalvosMap = {};
    let carregando = true;

    const SEM_FOTO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23e6e9f0'/><circle cx='32' cy='25' r='11' fill='%23a3abbd'/><path d='M10 64c2-14 12-22 22-22s20 8 22 22z' fill='%23a3abbd'/></svg>";

    // INÍCIO ÍCONES
    const SVG_MASC = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#3b82f6'/></svg>`;
    const SVG_FEM = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='#ec4899'/></svg>`;

    const ICONE_MASC = 'data:image/svg+xml;utf8,' + encodeURIComponent(SVG_MASC);
    const ICONE_FEM = 'data:image/svg+xml;utf8,' + encodeURIComponent(SVG_FEM);
    // FIM ÍCONES

    async function carregar(manterTurma = null) {
        const [r1, r2] = await Promise.all([
            sb.from('alunos').select('*').order('nome'),
            sb.from('relatorios').select('*')
        ]);
        alunos = r1.data || [];
        relatoriosSalvosMap = {};
        if (r2.data) r2.data.forEach(r => relatoriosSalvosMap[r.aluno_id] = r.texto_completo);
        carregando = false;
        if (manterTurma) turmaAtiva = manterTurma;
        else if (alunos.length > 0 && (!turmaAtiva || !alunos.some(a => a.turma === turmaAtiva))) turmaAtiva = alunos[0].turma;
        renderTabs(); renderTabela(); renderRelatorios();
    }

    async function salvarIndividual() {
        const nome = document.getElementById('nomeInd').value.trim();
        const turma = document.getElementById('turmaInd').value.trim();
        const perfil = document.getElementById('perfilInd').value || null;
        const perfil_comp = document.getElementById('perfilCompInd').value || null;
        if (!nome || !turma) return mostrarToast('Preencha nome e turma.');
        const { data, error } = await sb.from('alunos')
            .insert([{ nome, turma, genero: document.getElementById('generoInd').value, perfil, perfil_comp }])
            .select().single();
        if (error) return mostrarToast('Não foi possível salvar. Tente de novo.');
        document.getElementById('nomeInd').value = "";
        document.getElementById('perfilInd').value = "";
        document.getElementById('perfilCompInd').value = "";
        await carregar(turma);
        if (perfil && perfil_comp) {
            await gerarIndividual(data.id, false);
            mostrarToast('Aluno cadastrado e relatório gerado!');
        } else {

    const NOMES_MASC = new Set(['luca','gianluca','joshua','kaua','caua','bira','jota']);

    function inferirGenero(nomeCompleto) {
        const primeiro = (nomeCompleto || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/^[^a-z]+/, '')
            .split(/\s+/)[0] || '';
        if (NOMES_FEM.has(primeiro)) return 'fem';
        if (NOMES_MASC.has(primeiro)) return 'masc';
        if (/(elle|ele|ine|ane|ice|lly|ly|lyn)$/.test(primeiro)) return 'fem';
        if (primeiro.endsWith('a')) return 'fem';
        return 'masc';
    }

    async function copiarRelatorios() {
        const lista = alunos
            .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
            .sort((a, b) => a.nome.localeCompare(b.nome));
        if (lista.length === 0) return mostrarToast('Não há relatórios para copiar.');

        const texto = turmaAtiva + '\n\n' + lista
            .map(a => `${a.nome.toUpperCase()}\n${juntarRel(relatoriosSalvosMap[a.id])}`)
            .join('\n\n');

        try {
            await navigator.clipboard.writeText(texto);
        } catch (e) {
            // Plano B para navegadores que bloqueiam a área de transferência
            const t = document.createElement('textarea');
            t.value = texto;
            t.style.position = 'fixed';
            t.style.opacity = '0';
            document.body.appendChild(t);
            t.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(t);
            if (!ok) return mostrarToast('Não foi possível copiar.');
        }
        mostrarToast('Relatórios copiados!');
    }

    // Reduz a foto e salva em WebP: página e banco ficam bem mais leves
    function comprimirFoto(file) {
        return new Promise(resolve => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const escala = Math.min(1, 480 / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * escala);
                c.height = Math.round(img.height * escala);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                URL.revokeObjectURL(url);
                resolve(c.toDataURL('image/webp', 0.8));
            };
            img.src = url;
        });
    }

    async function alterarFoto(input, id, doModal = false) {

            const aluno = alunos.find(a => a.id === id);
            if (aluno) aluno.foto_url = dataUrl;

    async function excluirTurma() {
        const ok = await confirmarSite('Excluir turma?', `A turma "${turmaAtiva}" e todos os seus alunos serão removidos. Essa ação não pode ser desfeita.`);
        if (!ok) return;
        const ids = alunos.filter(a => a.turma === turmaAtiva).map(a => a.id);
        if (ids.length) {
            const r1 = await sb.from('relatorios').delete().in('aluno_id', ids);
            if (r1.error) return mostrarToast('Não foi possível excluir: ' + r1.error.message);
        }
        const r2 = await sb.from('alunos').delete().eq('turma', turmaAtiva).select();
        if (r2.error) return mostrarToast('Não foi possível excluir: ' + r2.error.message);
        if (ids.length && (!r2.data || r2.data.length === 0)) return mostrarToast('O banco não permitiu excluir a turma (permissão).');
        ids.forEach(i => delete relatoriosSalvosMap[i]);
        turmaAtiva = "";
        await carregar();
        mostrarToast('Turma excluída.');
    }

    async function remover(id) {
        const a = alunos.find(al => al.id === id);
        const ok = await confirmarSite('Excluir aluno?', `${a ? a.nome : 'Este aluno'} será removido da turma. Essa ação não pode ser desfeita.`);
        if (!ok) return;
        const r1 = await sb.from('relatorios').delete().eq('aluno_id', id);
        if (r1.error) return mostrarToast('Não foi possível excluir: ' + r1.error.message);
        const r2 = await sb.from('alunos').delete().eq('id', id).select();
        if (r2.error) return mostrarToast('Não foi possível excluir: ' + r2.error.message);
        if (!r2.data || r2.data.length === 0) return mostrarToast('O banco não permitiu excluir este aluno (permissão).');
        delete relatoriosSalvosMap[id];
        await carregar(turmaAtiva);
        mostrarToast('Aluno excluído.');
    }

    const PERFIS_PED = { participativo: 'Participativo', pouco_participativo: 'Pouco participativo', agitado: 'Agitado', melhorar: 'Melhorar' };
    const PERFIS_COMP = { lider: 'Líder', competitivo: 'Competitivo(a)', ansioso: 'Ansioso(a)', disperso: 'Disperso(a)', convivencia: 'Em desenvolvimento nas relações', esperado: 'Dentro do esperado' };

    function opcoesPerfil(lista, atual, vazio = 'Selecione...') {
        return `<option value="" ${!lista[atual] ? 'selected' : ''}>${vazio}</option>` +
            Object.entries(lista).map(([v, n]) => `<option value="${v}" ${v === atual ? 'selected' : ''}>${n}</option>`).join('');
    }
    function perfisCompletos(a) { return !!(a && PERFIS_PED[a.perfil] && PERFIS_COMP[a.perfil_comp]); }

    document.getElementById('perfilCompInd').innerHTML = opcoesPerfil(PERFIS_COMP, '');

    async function trocarPerfil(id, campo, valor) {
        await atualizarDado(id, campo, valor || null);
        const a = alunos.find(al => al.id === id);
        if (perfisCompletos(a)) {
            await gerarIndividual(id, false);
            mostrarToast(`Relatório de ${a.nome.split(' ')[0]} gerado.`);
        } else {
            mostrarToast('Escolha também o outro perfil para gerar o relatório.');
        }
        abrirModalAluno(id);
    }

    function lerRel(txt) {
        try { const o = JSON.parse(txt); if (o && o.p) return o; } catch (e) {}
        return { p: txt || '', c: '', o: '' };
    }
    function juntarRel(txt, sep = '\n\n') {
        const r = lerRel(txt);
        return [r.p, r.c, r.o].filter(Boolean).join(sep);
    }

    function montarRelatorio(a) {
        const ped = BANCO[a.perfil];        // parágrafo pedagógico + observações
        const comp = BANCO[a.perfil_comp];  // parágrafo comportamental e emocional
        const nome = a.nome.trim().split(/\s+/)[0];
        const fem = a.genero === 'fem';
        const pick = arr => Math.floor(Math.random() * arr.length);
        const ordens = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
        const usados = new Set(alunos
            .filter(x => x.turma === a.turma && x.id !== a.id && relatoriosSalvosMap[x.id])
            .map(x => lerRel(relatoriosSalvosMap[x.id]).kc));
        let kc, ic;
        for (let t = 0; t < 80; t++) {
            ic = [pick(ped.p1), pick(ped.p2), pick(ped.o), pick(comp.c1), pick(comp.c2), pick(comp.c3), Math.floor(Math.random() * 6)];
            kc = a.perfil + '|' + a.perfil_comp + '|' + ic.join('-');
            if (!usados.has(kc)) break;
        }
        const f = s => s.replace(/@/g, fem ? 'a' : 'o').replace(/\{n\}/g, nome);
        const fr = [comp.c1[ic[3]], comp.c2[ic[4]], comp.c3[ic[5]]];
        const c = ordens[ic[6]].map(i => fr[i]).join(' ');
        return JSON.stringify({ kc, p: f(ped.p1[ic[0]] + ' ' + ped.p2[ic[1]]), c: f(c), o: f(ped.o[ic[2]]) });
    }

    async function gerarIndividual(id, rolar = true) {
        const a = alunos.find(al => al.id === id);
        if (!perfisCompletos(a)) {
            mostrarToast('Escolha os dois perfis do aluno para gerar o relatório.');
            abrirModalAluno(id);
            return;
        }
        const textoFinal = montarRelatorio(a);
        // O texto entra no mapa antes de salvar, para a checagem de repetição da turma funcionar
        relatoriosSalvosMap[id] = textoFinal;
        await sb.from('relatorios').delete().eq('aluno_id', id);
        const { error } = await sb.from('relatorios').insert({ aluno_id: id, texto_completo: textoFinal });
        if (error) {
            delete relatoriosSalvosMap[id];
            renderRelatorios();
            return mostrarToast('Não foi possível salvar o relatório: ' + error.message);
        }
        renderRelatorios();
        if (rolar) rolarAte(id);
    }

    async function imprimirRelatorios() {
        const lista = alunos
            .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
            .sort((a, b) => a.nome.localeCompare(b.nome));
        if (lista.length === 0) return mostrarToast('Não há relatórios para imprimir.');
        const area = document.getElementById('folhaImpressao');
        const dataImp = new Date().toLocaleDateString('pt-BR');
        area.innerHTML = lista.map(a => paginaRel(a, lerRel(relatoriosSalvosMap[a.id]), dataImp)).join('');

        window.print();
    }

    function nomeArquivoSeguro(s) {
        return String(s).replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim() || 'sem-nome';
    }

    async function baixarPDFs() {
        const lista = alunos
            .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
            .sort((a, b) => a.nome.localeCompare(b.nome));
        if (lista.length === 0) return mostrarToast('Não há relatórios para baixar.');
        if (!window.html2canvas || !window.jspdf || !window.JSZip) return mostrarToast('Bibliotecas ainda carregando. Tente de novo em instantes.');

        const { jsPDF } = window.jspdf;
        const btn = document.getElementById('btnPdf');
        const area = document.getElementById('pdfRender');
        const dataImp = new Date().toLocaleDateString('pt-BR');
        const nomePasta = nomeArquivoSeguro(turmaAtiva);
        const zip = new JSZip();
        const pasta = zip.folder(nomePasta);
        const usados = new Set();
        btn.disabled = true;

        try {
            for (let i = 0; i < lista.length; i++) {
                const a = lista[i];
                btn.textContent = `Gerando ${i + 1}/${lista.length}...`;
                area.innerHTML = paginaRel(a, lerRel(relatoriosSalvosMap[a.id]), dataImp);
                await Promise.all([...area.querySelectorAll('img')].map(im => im.decode().catch(() => {})));
                const canvas = await html2canvas(area.querySelector('.folha'), { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 });
                const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
                pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);

                let nome = nomeArquivoSeguro(a.nome), n = 2;
                while (usados.has(nome.toLowerCase())) nome = nomeArquivoSeguro(a.nome) + ' (' + n++ + ')';
                usados.add(nome.toLowerCase());
                pasta.file(nome + '.pdf', pdf.output('arraybuffer'));
            }
            btn.textContent = 'Compactando...';
            const blob = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nomePasta + '.zip';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(link.href), 10000);
            mostrarToast(`${lista.length} PDF(s) baixados na pasta "${nomePasta}".`);
        } catch (e) {
            mostrarToast('Não foi possível gerar os PDFs: ' + (e.message || e));
        } finally {
            area.innerHTML = '';
            btn.disabled = false;
            btn.textContent = 'Baixar PDFs';
        }
    }

    async function gerarTurmaToda() {
        const turma = alunos.filter(a => a.turma === turmaAtiva);
        const prontos = turma.filter(perfisCompletos);
        const faltam = turma.length - prontos.length;
        if (prontos.length === 0) return mostrarToast('Escolha os dois perfis de cada aluno para gerar.');

    // INÍCIO SELECT PRÓPRIO
    const CS_SETA = '<svg class="flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    const CS_OK = '<svg class="flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
    const CS_VALOR = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
    let csAberto = null;

    function csFechar(devolverFoco = false) {
        if (!csAberto) return;
        const { btn, lista } = csAberto;
        csAberto = null;
        lista.remove();
        btn.setAttribute('aria-expanded', 'false');
        if (devolverFoco && btn.isConnected) btn.focus();
    }

    function csAtualizar(sel) {
        const btn = sel._csBtn;
        if (!btn) return;
        const op = sel.options[sel.selectedIndex];
        const txt = op ? op.textContent : '';
        const span = btn.firstChild;
        if (span.textContent !== txt) span.textContent = txt;
        span.classList.toggle('cs-vazio', sel.value === '');
        btn.setAttribute('aria-label', (sel._csRot ? sel._csRot + ': ' : '') + txt);
    }

    function csAbrir(sel) {
        const btn = sel._csBtn;
        if (csAberto && csAberto.btn === btn) return csFechar(true);
        csFechar();
        const lista = document.createElement('div');
        lista.className = 'cs-lista';
        lista.setAttribute('role', 'listbox');
        lista.setAttribute('aria-label', sel._csRot || '');
        [...sel.options].forEach(op => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'cs-op';
            b.setAttribute('role', 'option');
            const marcado = op.value !== '' && op.value === sel.value;
            b.setAttribute('aria-selected', String(marcado));
            const t = document.createElement('span');
            t.textContent = op.textContent;
            b.appendChild(t);
            if (marcado) b.insertAdjacentHTML('beforeend', CS_OK);
            b.onclick = () => {
                csFechar(true);
                if (sel.value !== op.value) {
                    sel.value = op.value;
                    sel.dispatchEvent(new Event('change', { bubbles: true }));
                }
            };
            lista.appendChild(b);
        });
        lista.addEventListener('keydown', e => {
            const ops = [...lista.querySelectorAll('.cs-op')];
            const i = ops.indexOf(document.activeElement);
            if (e.key === 'ArrowDown') { e.preventDefault(); ops[Math.min(i + 1, ops.length - 1)].focus(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); ops[Math.max(i - 1, 0)].focus(); }
            else if (e.key === 'Home') { e.preventDefault(); ops[0].focus(); }
            else if (e.key === 'End') { e.preventDefault(); ops[ops.length - 1].focus(); }
            else if (e.key === 'Escape') { e.preventDefault(); csFechar(true); }
            else if (e.key === 'Tab') csFechar();
        });
        document.body.appendChild(lista);
        csAberto = { btn, lista };
        btn.setAttribute('aria-expanded', 'true');

        lista.style.width = 'max-content';
        const r = btn.getBoundingClientRect();
        const desejada = Math.min(lista.scrollHeight + 2, 280);
        const abaixo = window.innerHeight - r.bottom - 8;
        const acima = r.top - 8;
        const emBaixo = abaixo >= desejada || abaixo >= acima;
        const altura = Math.min(desejada, emBaixo ? abaixo : acima);
        const largura = Math.min(Math.max(r.width, lista.offsetWidth), window.innerWidth - 16);
        lista.style.width = largura + 'px';
        lista.style.left = Math.max(8, Math.min(r.left, window.innerWidth - largura - 8)) + 'px';
        lista.style.maxHeight = altura + 'px';
        lista.style.top = (emBaixo ? r.bottom + 4 : r.top - 4 - altura) + 'px';

        const alvo = lista.querySelector('[aria-selected="true"]') || lista.firstChild;
        if (alvo) { alvo.focus({ preventScroll: true }); alvo.scrollIntoView({ block: 'nearest' }); }
    }

    function melhorarSelects() {
        if (csAberto && !csAberto.btn.isConnected) csFechar();
        document.querySelectorAll('select.field').forEach(sel => {
            if (sel._csBtn) { csAtualizar(sel); return; }
            const rotulo = sel.getAttribute('aria-label') || (document.querySelector('label[for="' + sel.id + '"]') || {}).textContent || '';
            const wrap = document.createElement('div');
            wrap.className = 'cs';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cs-btn' + (sel.classList.contains('field-sm') ? ' cs-sm' : '');
            btn.setAttribute('aria-haspopup', 'listbox');
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = '<span class="cs-txt"></span>' + CS_SETA;
            btn.onclick = () => csAbrir(sel);
            btn.onkeydown = e => { if (e.key === 'ArrowDown') { e.preventDefault(); csAbrir(sel); } };
            sel._csBtn = btn;
            sel._csRot = rotulo.trim();
            // Quando o código define sel.value, o botão acompanha
            Object.defineProperty(sel, 'value', {
                configurable: true,
                get() { return CS_VALOR.get.call(this); },
                set(v) { CS_VALOR.set.call(this, v); csAtualizar(this); }
            });
            sel.parentNode.insertBefore(wrap, sel);
            wrap.appendChild(btn);
            wrap.appendChild(sel);
            sel.classList.add('cs-oculto');
            sel.tabIndex = -1;
            csAtualizar(sel);
        });
    }

    document.addEventListener('pointerdown', e => {
        if (!csAberto) return;
        if (csAberto.lista.contains(e.target) || csAberto.btn.contains(e.target)) return;
        csFechar();
    }, true);
    window.addEventListener('scroll', e => { if (csAberto && !csAberto.lista.contains(e.target)) csFechar(); }, true);
    window.addEventListener('resize', () => csFechar());

    // Transforma também os selects que o site cria depois (janela do aluno, lista de alunos)
    let csAgendado = false;
    new MutationObserver(() => {
        if (csAgendado) return;
        csAgendado = true;
        requestAnimationFrame(() => { csAgendado = false; melhorarSelects(); });
    }).observe(document.body, { childList: true, subtree: true });
    melhorarSelects();
    // FIM SELECT PRÓPRIO

    // INÍCIO AUTH
    async function entrar() {
        const email = document.getElementById('loginEmail').value.trim();
        const senha = document.getElementById('loginSenha').value;
        const erro = document.getElementById('loginErro');
        const btn = document.getElementById('loginBtn');
        erro.textContent = '';
        if (!email || !senha) { erro.textContent = 'Informe e-mail e senha.'; return; }
        btn.disabled = true; btn.textContent = 'Entrando...';
        const { error } = await sb.auth.signInWithPassword({ email, password: senha });
        btn.disabled = false; btn.textContent = 'Entrar';
        if (error) { erro.textContent = 'E-mail ou senha incorretos.'; return; }
        document.getElementById('loginSenha').value = '';
    }

    async function sair() {

    let usuarioAtual = null;
    sb.auth.onAuthStateChange((evento, sessao) => {
        if (sessao && sessao.user) {
            document.getElementById('telaLogin').classList.add('hidden');
            // Só carrega quando o usuário muda (evita recarregar a cada renovação de token)
            if (sessao.user.id !== usuarioAtual) {
                usuarioAtual = sessao.user.id;
                // setTimeout evita travar o cliente do Supabase dentro deste callback
                setTimeout(() => { mostrarAba('alunos'); carregar(); }, 0);
            }
        } else {
            usuarioAtual = null;
            alunos = []; turmaAtiva = ""; relatoriosSalvosMap = {}; carregando = true;
