<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Educação Física</title>
    
    <!-- Configurações PWA -->
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2955/2955485.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2955/2955485.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @media print { .no-print { display: none; } }
        .aba-ativa { border-bottom: 3px solid #4f46e5; font-weight: bold; color: #4f46e5; }
        .foto-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; border: 2px solid #e2e8f0; cursor: pointer; transition: all 0.2s; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50 p-2 md:p-8 font-sans">

    <!-- MODAL DE DETALHES -->
    <div id="modalAluno" class="modal no-print" onclick="fecharModal(event)">
        <div class="bg-white w-full max-w-lg rounded-2xl p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div id="modalConteudo"></div>
            <button onclick="document.getElementById('modalAluno').classList.remove('active')" class="w-full mt-6 bg-indigo-600 text-white py-3 rounded-xl font-bold">Fechar e Salvar</button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto bg-white p-4 md:p-6 rounded-2xl shadow-xl border border-gray-100 no-print">
        <h1 class="text-2xl font-black mb-6 text-gray-800 border-b pb-4">Gerador de Relatórios: Ed. Física</h1>

        <!-- CADASTRO -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 space-y-3">
                <h2 class="font-bold text-indigo-900">Cadastro Individual</h2>
                <input type="text" id="nomeInd" placeholder="Nome do Aluno" class="w-full p-2 border rounded-lg outline-none">
                <input type="text" id="turmaInd" placeholder="Turma (ex: 6º Ano A)" class="w-full p-2 border rounded-lg outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <select id="generoInd" class="p-2 border rounded-lg bg-white"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
                    <select id="perfilInd" class="p-2 border rounded-lg bg-white">
                        <option value="participativo">Participativo</option>
                        <option value="pouco_participativo">Pouco Part.</option>
                        <option value="agitado">Agitado</option>
                        <option value="melhorar">Melhorar</option>
                    </select>
                </div>
                <button onclick="salvarIndividual()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition">Salvar Aluno</button>
            </div>
            
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                <h2 class="font-bold text-emerald-900 mb-2">Importar Lista (Massa)</h2>
                <textarea id="bulkAlunos" placeholder="Nomes (um por linha)" class="w-full p-2 border rounded-lg h-20 mb-2 outline-none"></textarea>
                <input type="text" id="turmaBulk" placeholder="Turma para este lote" class="w-full p-2 border rounded-lg mb-2 outline-none">
                <button onclick="salvarMassa()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition">Importar Todos</button>
            </div>
        </div>

        <div id="abasContainer" class="flex gap-4 mb-2 overflow-x-auto border-b pb-2"></div>
        <div id="acoesTurma" class="flex gap-2 mb-4 justify-end hidden">
            <button onclick="renomearTurma()" class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">Renomear Turma</button>
            <button onclick="excluirTurma()" class="text-xs bg-red-50 text-red-500 px-3 py-1 rounded-lg font-bold">Excluir Turma</button>
        </div>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-left bg-white">
                <thead class="bg-gray-100 text-gray-600 text-xs uppercase">
<tr><th class="p-3">Foto</th><th class="p-3">Nome</th><th class="p-3">Gênero</th><th class="p-3">Perfil</th><th class="p-3 text-center">Ações</th></tr>
                </thead>
                <tbody id="tabelaAlunos" class="divide-y text-sm"></tbody>
            </table>
        </div>
        <button onclick="gerarTurmaToda()" class="mt-6 w-full md:w-auto bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Gerar Relatórios da Turma</button>
    </div>

    <!-- RESULTADOS -->
    <div id="resultadoArea" class="max-w-4xl mx-auto mt-8 p-4 md:p-6 bg-white rounded-2xl shadow-lg border hidden print:block print:mt-0 print:shadow-none">
        <div class="flex justify-between items-center mb-6 no-print border-b pb-4">
            <h2 class="text-xl font-bold text-gray-800">Relatórios Gerados</h2>
            <button onclick="window.print()" class="bg-gray-800 text-white px-6 py-2 rounded-lg font-bold">Imprimir / PDF</button>
        </div>
        <div id="listaRelatorios" class="space-y-6"></div>
    </div>

imento de suas capacidades motoras básicas. Com paciência e exercícios adequados, estamos estimulando seu progresso e fortalecendo seu interesse pelas práticas esportivas, respeitando seu momento.", "apresenta potencial e estamos focadas em ampliar sua confiança nas atividades. Com o suporte da família junto à nossa parceria pedagógica, caminhamos passo a passo para conquistas importantes no desenvolvimento de suas habilidades."] }

        async function carregar(manterTurma = null) {
            const { data: dataAlunos } = await sb.from('alunos').select('*').order('nome');
            alunos = dataAlunos || [];
            const { data: dataRels } = await sb.from('relatorios').select('*');
            relatoriosSalvosMap = {};
            if (dataRels) dataRels.forEach(r => relatoriosSalvosMap[r.aluno_id] = r.texto_completo);
            if (manterTurma) turmaAtiva = manterTurma;
            else if (alunos.length > 0 && (!turmaAtiva || !alunos.some(a => a.turma === turmaAtiva))) turmaAtiva = alunos[0].turma;
            renderTabs(); renderTabela(); renderRelatorios();
        }

        async function salvarIndividual() {
            const nome = document.getElementById('nomeInd').value.trim();
            const turma = document.getElementById('turmaInd').value.trim();
            if (!nome || !turma) return alert("Preencha Nome e Turma!");
            await sb.from('alunos').insert([{ nome, turma, genero: document.getElementById('generoInd').value, perfil: document.getElementById('perfilInd').value }]);
            document.getElementById('nomeInd').value = ""; await carregar(turma);
        }

        async function salvarMassa() {
            const texto = document.getElementById('bulkAlunos').value.trim();
            const turma = document.getElementById('turmaBulk').value.trim();
            if (!texto || !turma) return alert("Preencha!");
            const novos = texto.split('\n').filter(n => n.trim()).map(n => ({ nome: n.trim(), turma, genero: 'masc', perfil: 'participativo' }));
            await sb.from('alunos').insert(novos);
            document.getElementById('bulkAlunos').value = ""; document.getElementById('turmaBulk').value = "";
            await carregar(turma);
        }

        async function atualizarDado(id, campo, valor) {
            const aluno = alunos.find(a => a.id === id);
            if (aluno) {
                aluno[campo] = valor;
                await sb.from('alunos').update({ [campo]: valor }).eq('id', id);
                if (campo === 'turma' || campo === 'nome') await carregar(aluno.turma); else renderTabela();
            }
        }

        function abrirModalAluno(id) {
    const a = alunos.find(al => al.id === id);
    document.getElementById('modalConteudo').innerHTML = `
        <div class="relative inline-block w-full text-center">
            <img src="${a.foto_url || 'https://via.placeholder.com/200'}" class="w-64 h-64 mx-auto object-cover rounded-2xl border-4 border-indigo-50 shadow-lg">
            <label class="absolute bottom-2 right-[calc(50%-110px)] bg-indigo-600 text-white p-2 rounded-full cursor-pointer shadow-md">
                ✎ <input type="file" accept="image/*" capture="user" class="hidden" onchange="alterarFoto(this, '${a.id}', true)">
            </label>
        </div>
        <div class="mt-4 text-left">
            <label class="text-[10px] font-bold text-gray-400 uppercase">Nome (Toque para editar)</label>
            <input type="text" value="${a.nome}" onchange="atualizarDado('${a.id}', 'nome', this.value); abrirModalAluno('${a.id}');" 
                class="w-full text-2xl font-black text-indigo-900 border-b-2 border-gray-100 outline-none pb-1 bg-transparent">

            <div class="grid grid-cols-2 gap-3 mt-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Turma</label>
                    <input type="text" value="${a.turma}" onchange="atualizarDado('${a.id}', 'turma', this.value.trim()); abrirModalAluno('${a.id}');"
                        class="w-full p-2 border rounded-lg outline-none text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Gênero</label>
                    <select onchange="atualizarDado('${a.id}', 'genero', this.value); abrirModalAluno('${a.id}');"
                        class="w-full p-2 border rounded-lg bg-white text-sm">
                        <option value="masc" ${a.genero==='masc'?'selected':''}>Masculino</option>
                        <option value="fem" ${a.genero==='fem'?'selected':''}>Feminino</option>
                    </select>
                </div>
            </div>

            <p class="text-sm text-gray-500 mt-3 uppercase">Perfil: ${a.perfil}</p>
        </div>
    `;
    document.getElementById('modalAluno').classList.add('active');
}

        function fecharModal(e) { if (e && e.target.id === 'modalAluno') document.getElementById('modalAluno').classList.remove('active'); }

        async function alterarFoto(input, id, doModal = false) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    await sb.from('alunos').update({ foto_url: e.target.result }).eq('id', id);
                    const aluno = alunos.find(a => a.id === id);
                    if (aluno) aluno.foto_url = e.target.result;
                    if(doModal) abrirModalAluno(id);
                    renderTabela();
                    renderRelatorios();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function renomearTurma() {
            const novo = prompt(`Novo nome para "${turmaAtiva}":`);
            if (novo && novo.trim() !== "") { 
                const nomeLimpo = novo.trim();
                await sb.from('alunos').update({ turma: nomeLimpo }).eq('turma', turmaAtiva); 
                await carregar(nomeLimpo); 
            }
        }

        async function excluirTurma() {
            if (confirm(`Excluir toda a turma "${turmaAtiva}"?`)) { 
                await sb.from('alunos').delete().eq('turma', turmaAtiva); 
                turmaAtiva = ""; 
                await carregar(); 
            }
        }

        async function remover(id) { if (confirm("Excluir?")) { await sb.from('alunos').delete().eq('id', id); await carregar(turmaAtiva); } }

        function renderTabs() {
            const container = document.getElementById('abasContainer');
            const acoes = document.getElementById('acoesTurma');
            const turmas = [...new Set(alunos.map(a => a.turma))].sort();
            if (turmas.length > 0) {
                acoes.classList.remove('hidden');
                container.innerHTML = turmas.map(t => `<button onclick="turmaAtiva='${t}'; renderTabs(); renderTabela(); renderRelatorios();" class="pb-2 px-4 text-xs md:text-sm whitespace-nowrap ${turmaAtiva === t ? 'aba-ativa' : 'text-gray-400'}">${t}</button>`).join('');
            } else { acoes.classList.add('hidden'); container.innerHTML = ""; }
        }

        function renderTabela() {
    const tbody = document.getElementById('tabelaAlunos');
    const filtrados = alunos.filter(a => a.turma === turmaAtiva).sort((a,b) => a.nome.localeCompare(b.nome));
    if (filtrados.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">Nenhum aluno.</td></tr>`; return; }
    tbody.innerHTML = filtrados.map(a => `
        <tr class="hover:bg-gray-50 border-b">
            <td class="p-2"><img src="${a.foto_url || 'https://via.placeholder.com/50'}" onclick="abrirModalAluno('${a.id}')" class="foto-preview"></td>
            <td class="p-2 font-bold text-gray-700 cursor-pointer" onclick="abrirModalAluno('${a.id}')">${a.nome}</td>
            <td class="p-2">
                <select onchange="atualizarDado('${a.id}', 'genero', this.value)" class="p-1 border rounded bg-white text-xs w-full">
                    <option value="masc" ${a.genero==='masc'?'selected':''}>Masculino</option>
                    <option value="fem" ${a.genero==='fem'?'selected':''}>Feminino</option>
                </select>
            </td>
            <td class="p-2">
                <select onchange="atualizarDado('${a.id}', 'perfil', this.value)" class="p-1 border rounded bg-white text-xs w-full">
                    <option value="participativo" ${a.perfil==='participativo'?'selected':''}>Participativo</option>
                    <option value="pouco_participativo" ${a.perfil==='pouco_participativo'?'selected':''}>Pouco Part.</option>
                    <option value="agitado" ${a.perfil==='agitado'?'selected':''}>Agitado</option>
                    <option value="melhorar" ${a.perfil==='melhorar'?'selected':''}>Melhorar</option>
                </select>
            </td>
            <td class="p-2 text-center flex justify-center gap-2">
                <button onclick="gerarIndividual('${a.id}')" class="bg-indigo-600 text-white px-3 py-1 rounded text-xs font-bold shadow-md">GERAR</button>
                <button onclick="remover('${a.id}')" class="text-red-500 p-1">✕</button>
            </td>
        </tr>
    `).join('');
}

        async function gerarIndividual(id) {
            const a = alunos.find(al => al.id === id);
            const opcoes = frasesLongas[a.perfil][a.genero];
            const fraseEscolhida = opcoes[Math.floor(Math.random() * opcoes.length)];
            const textoFinal = `${a.nome} ${fraseEscolhida}`;
            
            await sb.from('relatorios').upsert({ aluno_id: id, texto_completo: textoFinal });
            relatoriosSalvosMap[id] = textoFinal; 
            renderRelatorios();
            document.getElementById('resultadoArea').scrollIntoView({ behavior: 'smooth' });
        }

        function gerarTurmaToda() { alunos.filter(a => a.turma === turmaAtiva).forEach(a => gerarIndividual(a.id)); }

        function renderRelatorios() {
            const area = document.getElementById('resultadoArea');
            const container = document.getElementById('listaRelatorios');
            
            const filtrados = alunos
                .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
                .sort((a, b) => a.nome.localeCompare(b.nome));

            const html = filtrados.map(a => {
                return `<div class="flex flex-col md:flex-row items-center md:items-start gap-4 p-4 bg-gray-50 rounded-xl border-l-8 border-indigo-500 relative">
                    <button onclick="removerRelatorio('${a.id}')" class="no-print absolute top-2 right-2 text-gray-400">✕</button>
                    ${a.foto_url ? `<img src="${a.foto_url}" class="w-24 h-24 rounded-lg object-cover shadow-sm bg-white p-1 flex-shrink-0">` : ''}
                    <div class="flex-1 text-center md:text-justify"><p class="font-bold text-gray-800">${a.nome.toUpperCase()} (${turmaAtiva})</p><p class="text-gray-700 text-sm mt-1 leading-relaxed">${relatoriosSalvosMap[a.id]}</p></div></div>`;
            }).join('');

            if (html) { area.classList.remove('hidden'); container.innerHTML = html; } else area.classList.add('hidden');
        }

        async function removerRelatorio(id) { await sb.from('relatorios').delete().eq('aluno_id', id); delete relatoriosSalvosMap[id]; renderRelatorios(); }

        window.onload = carregar;
    </script>
</body>
</html>
