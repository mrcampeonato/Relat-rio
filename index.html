<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatórios Educação Física</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@media print { .no-print { display: none; } }</style>
</head>
<body class="bg-gray-50 p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-gray-800 border-b pb-4">Gerador de Relatórios: Educação Física</h1>

        <!-- Painel de Adição -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8 no-print p-4 bg-gray-100 rounded-lg">
            <div>
                <input type="text" id="nomeInd" placeholder="Nome do Aluno" class="w-full p-2 mb-2 border rounded">
                <input type="text" id="turmaInd" placeholder="Turma (ex: 1º A)" class="w-full p-2 mb-2 border rounded">
                <select id="generoInd" class="w-full p-2 mb-2 border rounded"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
                <select id="perfilInd" class="w-full p-2 mb-2 border rounded">
                    <option value="participativo">Participativo</option><option value="pouco_participativo">Pouco participativo</option>
                    <option value="agitado">Agitado</option><option value="melhorar">Precisa melhorar</option>
                </select>
                <button onclick="adicionarAluno()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Adicionar Aluno</button>
            </div>
        </div>

        <!-- Abas e Tabela -->
        <div id="abasContainer" class="flex gap-2 mb-4 no-print border-b"></div>
        <div class="overflow-x-auto no-print">
            <table class="w-full mb-6">
                <thead><tr class="bg-gray-200 text-left"><th class="p-3">Nome</th><th class="p-3">Gênero</th><th class="p-3">Perfil</th><th class="p-3">Ações</th></tr></thead>
                <tbody id="tabelaAlunos" class="divide-y"></tbody>
            </table>
        </div>
        <button onclick="gerarTurma()" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700 no-print">Gerar Relatórios da Turma Atual</button>
    </div>

    <!-- Resultados -->
    <div id="resultado" class="max-w-6xl mx-auto mt-8 p-6 bg-white rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6 no-print">
            <h2 class="text-xl font-bold">Relatórios Gerados</h2>
            <button onclick="window.print()" class="bg-gray-800 text-white px-4 py-2 rounded">Imprimir / PDF</button>
        </div>
        <div id="listaRelatorios" class="space-y-6"></div>
    </div>

    <script>
        let alunos = [];
        let turmaAtual = "";
        let relatoriosSalvos = {}; // ID Aluno -> HTML do relatório

        const frasesLongas = {
            participativo: {
                masc: "Demonstra um excelente engajamento nas aulas de Educação Física. Participa com entusiasmo de todas as atividades propostas, exibindo um desenvolvimento motor adequado para sua faixa etária. Além disso, valoriza o espírito de equipe, colaborando ativamente com os colegas e demonstrando respeito absoluto às normas e regras estabelecidas durante os jogos coletivos.",
                fem: "Demonstra um excelente engajamento nas aulas de Educação Física. Participa com entusiasmo de todas as atividades propostas, exibindo um desenvolvimento motor adequado para sua faixa etária. Além disso, valoriza o espírito de equipe, colaborando ativamente com as colegas e demonstrando respeito absoluto às normas e regras estabelecidas durante os jogos coletivos."
            },
            pouco_participativo: {
                masc: "Nas práticas esportivas, tem se mostrado um aluno observador e cauteloso. Estamos incentivando-o a interagir mais nos jogos, respeitando seu tempo de adaptação e processo de aprendizagem. Notamos um crescimento gradual em sua confiança, e seguimos trabalhando para que sinta-se mais seguro para explorar suas potencialidades motoras e sociais junto ao grupo.",
                fem: "Nas práticas esportivas, tem se mostrado uma aluna observadora e cautelosa. Estamos incentivando-a a interagir mais nos jogos, respeitando seu tempo de adaptação e processo de aprendizagem. Notamos um crescimento gradual em sua confiança, e seguimos trabalhando para que sinta-se mais segura para explorar suas potencialidades motoras e sociais junto ao grupo."
            },
            agitado: {
                masc: "Possui uma energia contagiante e muita criatividade, o que enriquece a dinâmica de nossas aulas. Trabalhamos diariamente para direcionar esse grande potencial para a execução técnica dos movimentos e para o foco necessário nas regras dos jogos. É gratificante observar como ele direciona essa vivacidade para superar novos desafios motores.",
                fem: "Possui uma energia contagiante e muita criatividade, o que enriquece a dinâmica de nossas aulas. Trabalhamos diariamente para direcionar esse grande potencial para a execução técnica dos movimentos e para o foco necessário nas regras dos jogos. É gratificante observar como ela direciona essa vivacidade para superar novos desafios motores."
            },
            melhorar: {
                masc: "Tem se dedicado com esforço em sua trajetória nas atividades práticas. Estamos focados em fortalecer sua coordenação motora e sua confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família em parceria com nossa prática pedagógica, seguimos caminhando passo a passo rumo a conquistas importantes no desenvolvimento de suas habilidades.",
                fem: "Tem se dedicado com esforço em sua trajetória nas atividades práticas. Estamos focados em fortalecer sua coordenação motora e sua confiança no ambiente esportivo. Acreditamos plenamente em seu progresso e, com o suporte da família em parceria com nossa prática pedagógica, seguimos caminhando passo a passo rumo a conquistas importantes no desenvolvimento de suas habilidades."
            }
        };

        function adicionarAluno() {
            const nome = document.getElementById("nomeInd").value;
            const turma = document.getElementById("turmaInd").value;
            if(!nome || !turma) return;
            alunos.push({ 
                id: Date.now() + Math.random(),
                nome, turma, 
                genero: document.getElementById("generoInd").value, 
                perfil: document.getElementById("perfilInd").value 
            });
            turmaAtual = turma;
            renderizarTabs();
        }

        function renderizarTabs() {
            const container = document.getElementById("abasContainer");
            const turmas = [...new Set(alunos.map(a => a.turma))];
            if(!turmaAtual && turmas.length > 0) turmaAtual = turmas[0];
            
            container.innerHTML = turmas.map(t => `
                <button onclick="mudarTurma('${t}')" class="px-4 py-2 ${turmaAtual === t ? 'border-b-2 border-indigo-600 font-bold' : ''}">${t}</button>
            `).join('');
            renderizarTabela();
        }

        function mudarTurma(t) { turmaAtual = t; renderizarTabs(); }

        function renderizarTabela() {
            const tbody = document.getElementById("tabelaAlunos");
            const filtrados = alunos.filter(a => a.turma === turmaAtual);
            tbody.innerHTML = filtrados.map((aluno, i) => `
                <tr>
                    <td class="p-3">${aluno.nome}</td>
                    <td class="p-3">${aluno.genero}</td>
                    <td class="p-3">${aluno.perfil}</td>
                    <td class="p-3 flex gap-2">
                        <button onclick="gerarIndividual(${alunos.indexOf(aluno)})" class="bg-indigo-600 text-white px-2 py-1 rounded text-xs">Gerar</button>
                        <button onclick="removerAluno(${alunos.indexOf(aluno)})" class="text-red-500 text-xs">Remover</button>
                    </td>
                </tr>
            `).join('');
        }

        function gerarIndividual(index) {
            const aluno = alunos[index];
            const texto = frasesLongas[aluno.perfil][aluno.genero];
            relatoriosSalvos[aluno.id] = `
                <div id="rel-${aluno.id}" class="p-4 border-l-4 border-indigo-500 bg-gray-50 rounded-r-lg relative">
                    <button onclick="delete relatoriosSalvos[${aluno.id}]; atualizarRelatorios()" class="absolute top-2 right-2 text-red-400">✕</button>
                    <p class="font-bold text-gray-800">${aluno.nome} - Turma: ${aluno.turma}</p>
                    <p class="text-gray-700 mt-2 leading-relaxed">${aluno.genero==='masc'?'O aluno':'A aluna'} ${texto}</p>
                </div>
            `;
            atualizarRelatorios();
        }

        function gerarTurma() {
            alunos.filter(a => a.turma === turmaAtual).forEach((_, i) => gerarIndividual(alunos.indexOf(_)));
        }

        function removerAluno(index) {
            const id = alunos[index].id;
            delete relatoriosSalvos[id];
            alunos.splice(index, 1);
            renderizarTabs();
            atualizarRelatorios();
        }

        function atualizarRelatorios() {
            document.getElementById("listaRelatorios").innerHTML = Object.values(relatoriosSalvos).join('');
        }
    </script>
</body>
</html>
```
