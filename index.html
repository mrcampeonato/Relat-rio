        body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }

        /* Botões e campos */
        .btn { min-height: 44px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(79,70,229,.55); }
        .btn-primary:hover { background: var(--brand-d); }
        .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { background: #f1f3f9; }
        .btn-danger { background: #fff; color: #b42318; border: 1px solid #f3c9c5; }
        .btn-danger:hover { background: #fdf0ef; }
        .btn-sm { min-height: 40px; padding: 0 14px; font-size: 13px; }
        .field { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 15px; color: var(--ink); }
        textarea.field { padding: 10px 12px; min-height: 96px; }
        .field-sm { min-height: 40px; font-size: 13px; }
        .label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        :focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
        .field:focus { border-color: var(--brand); outline: 3px solid #c7d2fe; outline-offset: 0; }

        /* Cartões e abas */
        .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; }
        .aba { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); background: #fff; border: 1px solid var(--line); transition: background-color .15s ease, color .15s ease; }
        .aba:hover { background: #eef0fb; }
        .aba-ativa { background: var(--ink); color: #fff; border-color: var(--ink); }
        .aba-ativa:hover { background: var(--ink); }

        .foto-preview { width: 52px; height: 52px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); cursor: pointer; transition: transform .15s ease; flex-shrink: 0; }
        .foto-preview:hover { transform: scale(1.05); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(20,33,61,.6); z-index: 50; align-items: flex-end; justify-content: center; padding: 0; }
        .modal.active { display: flex; }
        .modal-box { animation: subir .2s ease-out; }        @keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (min-width: 640px) { .modal { align-items: center; padding: 20px; } }

        /* Popup rápido de confirmação */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 16px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 70; box-shadow: 0 10px 30px -10px rgba(20,33,61,.5); max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
        /* INÍCIO TOPO */
.btn-topo { position: fixed; right: 16px; bottom: 88px; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px -8px rgba(20,33,61,.35); display: grid; place-items: center; cursor: pointer; z-index: 35; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s ease, transform .2s ease, background-color .15s ease; }
.btn-topo.show { opacity: .85; transform: none; pointer-events: auto; }
.btn-topo:hover { opacity: 1; background: #fff; }
/* FIM TOPO */
        @media print { .no-print { display: none !important; } body { background: #fff; } }
    #folhaImpressao { display: none; }
@media print {
    @page { size: A4; margin: 0; }
    body > *:not(#folhaImpressao) { display: none !important; }
    #folhaImpressao { display: block; }
    .folha { position: relative; width: 210mm; height: 297mm; padding: 24mm 20mm 20mm; box-sizing: border-box; overflow: hidden; break-after: page; page-break-after: always; font-family: Arial, Helvetica, sans-serif; font-size: 12pt; color: #000; }

    .folha .timbrado { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .folha .conteudo { position: relative; z-index: 1; }
    .folha p { margin: 0 0 3.8mm; line-height: 1.15; }
    .rt { text-align: center; font-weight: 700; }
    .rg { display: grid; grid-template-columns: var(--c) 1fr; }
    .rj { text-align: justify; }
    .ri { font-weight: 700; margin-bottom: 1.2mm !important; }
    .rh { font-weight: 700; margin-bottom: 1mm !important; }
    .rx { font-size: 10pt; line-height: 1.3 !important; text-align: justify; min-height: 24mm; margin-bottom: 3mm !important; }
    .rxo { min-height: 14mm; }
}

<body>
<!-- INÍCIO LOGIN -->
<div id="telaLogin" class="no-print fixed inset-0 grid place-items-center p-4" style="z-index:100; background:var(--bg)" role="dialog" aria-modal="true" aria-labelledby="loginTitulo">
    <div class="card w-full max-w-sm p-6 md:p-8 space-y-4 shadow-xl">
        <div>
            <h1 id="loginTitulo" class="font-display font-bold text-2xl">Ed. Física</h1>
            <p class="mt-1 text-sm" style="color:var(--muted)">Entre para acessar seus relatórios.</p>
        </div>
        <div>
            <label class="label" for="loginEmail">E-mail</label>
            <input id="loginEmail" type="email" class="field" autocomplete="username" onkeydown="if (event.key === 'Enter') document.getElementById('loginSenha').focus()">
        </div>
        <div>
            <label class="label" for="loginSenha">Senha</label>
            <input id="loginSenha" type="password" class="field" autocomplete="current-password" onkeydown="if (event.key === 'Enter') entrar()">
        </div>
        <p id="loginErro" class="text-sm min-h-[20px]" style="color:#b42318" role="alert"></p>
        <button id="loginBtn" onclick="entrar()" class="btn btn-primary w-full">Entrar</button>
    </div>
</div>
<!-- FIM LOGIN -->
    <!-- MODAL DE DETALHES -->
    <div id="modalAluno" class="modal no-print" onclick="fecharModal(event)" role="dialog" aria-modal="true" aria-label="Detalhes do aluno">
        <div class="modal-box bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div id="modalConteudo"></div>
            <button onclick="document.getElementById('modalAluno').classList.remove('active')" class="btn btn-primary w-full mt-6">Fechar e salvar</button>
        </div>
    </div>

    <!-- CONFIRMAÇÃO DE EXCLUSÃO (do site) -->
<div id="modalConfirma" class="modal no-print" role="alertdialog" aria-modal="true" aria-labelledby="confirmaTitulo" onclick="if (event.target === this) responderConfirma(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="confirmaTitulo" class="font-display font-semibold text-xl"></h2>
        <p id="confirmaTexto" class="mt-2 text-sm" style="color:var(--muted)"></p>
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderConfirma(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderConfirma(true)" class="btn btn-danger">Excluir</button>
        </div>
    </div>
</div>
<!-- JANELA DE TEXTO (renomear turma) -->
<div id="modalPrompt" class="modal no-print" role="dialog" aria-modal="true" aria-labelledby="promptTitulo" onclick="if (event.target === this) responderPrompt(false)">
    <div class="modal-box bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h2 id="promptTitulo" class="font-display font-semibold text-xl"></h2>
        <label for="promptInput" id="promptTexto" class="label mt-3"></label>
        <input id="promptInput" type="text" class="field" onkeydown="if (event.key === 'Enter') responderPrompt(true); if (event.key === 'Escape') responderPrompt(false);">
        <div class="grid grid-cols-2 gap-3 mt-6">
            <button onclick="responderPrompt(false)" class="btn btn-ghost">Cancelar</button>
            <button onclick="responderPrompt(true)" class="btn btn-primary">Salvar</button>
        </div>
    </div>
</div>
<!-- INÍCIO TOPO -->
<button id="btnTopo" class="btn-topo no-print" onclick="voltarAoTopo()" aria-label="Voltar ao topo" title="Voltar ao topo">

</button>

    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">

        <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Principal">
            <button id="nav-alunos" onclick="mostrarAba('alunos')" aria-current="page" class="px-4 min-h-[40px] rounded-lg hover:bg-gray-100 bg-indigo-50 text-indigo-700">Alunos</button>
<button id="nav-cadastro" onclick="mostrarAba('cadastro')" class="px-4 min-h-[40px] rounded-lg hover:bg-gray-100">Cadastrar</button>

    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 md:py-12">

    <!-- AMBIENTE 1: ALUNOS + RELATÓRIOS -->
    <div id="view-alunos" class="space-y-12">

        <section id="alunos" class="no-print">
            <h1 class="font-display font-bold text-3xl md:text-4xl leading-tight">Relatórios de Educação Física</h1>
            <p class="mt-2 text-base max-w-xl" style="color:var(--muted)">Escolha a turma, ajuste gênero e perfil de cada aluno e gere os relatórios.</p>

            <div id="abasContainer" class="flex gap-2 mt-8 overflow-x-auto pb-2" role="tablist"></div>
            <div id="acoesTurma" class="flex gap-2 mt-3 hidden">
                <button onclick="renomearTurma()" class="btn btn-ghost btn-sm">Renomear turma</button>
                <button onclick="excluirTurma()" class="btn btn-danger btn-sm">Excluir turma</button>
            </div>

            <div class="card mt-4 overflow-hidden">
                <div id="tabelaAlunos" class="divide-y" style="--tw-divide-opacity:1"></div>
            </div>
        </section>

        <!-- Botão de ação sempre visível -->
                <div class="no-print sticky bottom-0 z-30 -mx-4 px-4 py-3 bg-white/90 backdrop-blur border-t flex gap-2 justify-center md:justify-end" style="border-color:var(--line)">
            <button onclick="irParaPrimeiroRelatorio()" class="btn btn-ghost flex-1 md:flex-none md:px-6">Ir para relatórios</button>
            <button onclick="gerarTurmaToda()" class="btn btn-primary flex-[2] md:flex-none md:px-10">Gerar relatórios da turma</button>
        </div>

        <!-- RESULTADOS -->
        <section id="resultadoArea" class="card p-5 md:p-8 hidden print:block print:border-0">
            <div class="flex justify-between items-center gap-4 mb-6 no-print">
                <h2 class="font-display font-semibold text-2xl">Relatórios gerados</h2>
                <div class="flex gap-2">
    <button onclick="copiarRelatorios()" class="btn btn-ghost">Copiar</button>
    <button onclick="imprimirRelatorios()" class="btn btn-ghost">Imprimir / PDF</button>
</div>
            </div>
            <div id="listaRelatorios" class="space-y-4"></div>
        </section>
    </div>

    <!-- AMBIENTE 2: CADASTRO -->
    <div id="view-cadastro" class="hidden">
        <section id="cadastro" class="no-print">
            <h1 class="font-display font-bold text-3xl md:text-4xl leading-tight">Cadastrar alunos</h1>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                <div class="card p-5 md:p-6 space-y-4">
                    <h2 class="font-display font-semibold text-lg">Um aluno</h2>
                    <div><label class="label" for="nomeInd">Nome</label><input type="text" id="nomeInd" class="field" oninput="document.getElementById('generoInd').value = inferirGenero(this.value)"></div>
                    <div><label class="label" for="turmaInd">Turma (ex: 6º Ano A)</label><input type="text" id="turmaInd" class="field"></div>
                    <div>
    <label class="label" for="generoInd">Gênero</label>
    <select id="generoInd" class="field"><option value="masc">Masculino</option><option value="fem">Feminino</option></select>
</div>
<div>
    <label class="label" for="perfilInd">Perfil pedagógico</label>
    <select id="perfilInd" class="field"></select>
</div>
<div>
    <label class="label" for="perfilCompInd">Perfil comportamental e emocional</label>
    <select id="perfilCompInd" class="field"></select>
</div>
                    <button onclick="salvarIndividual()" class="btn btn-primary w-full">Salvar aluno</button>
                </div>

                <div class="card p-5 md:p-6 space-y-4">
                    <h2 class="font-display font-semibold text-lg">Lista de alunos</h2>
                    <div><label class="label" for="bulkAlunos">Nomes (um por linha)</label><textarea id="bulkAlunos" class="field"></textarea></div>
                    <div><label class="label" for="turmaBulk">Turma deste grupo</label><input type="text" id="turmaBulk" class="field"></div>
                    <button onclick="salvarMassa()" class="btn btn-ghost w-full">Importar todos</button>
                </div>
            </div>
        </section>
    </div>
</main>

function inferirGenero(nomeCompleto) {
    const primeiro = (nomeCompleto || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/^[^a-z]+/, '')
        .split(/\s+/)[0] || '';
    if (NOMES_FEM.has(primeiro)) return 'fem';
    if (NOMES_MASC.has(primeiro)) return 'masc';
    if (/(elle|ele|ine|ane|ice|lly|ly|lyn)$/.test(primeiro)) return 'fem';
    if (primeiro.endsWith('a')) return 'fem';
    return 'masc';
}

        async function copiarRelatorios() {

        .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
        .sort((a, b) => a.nome.localeCompare(b.nome));
    if (lista.length === 0) return mostrarToast('Não há relatórios para copiar.');

    const texto = turmaAtiva + '\n\n' + lista
        .map(a => `${a.nome.toUpperCase()}\n${juntarRel(relatoriosSalvosMap[a.id])}`)
        .join('\n\n');

    try {
        await navigator.clipboard.writeText(texto);
    } catch (e) {
        // Plano B para navegadores que bloqueiam a área de transferência
        const t = document.createElement('textarea');
        t.value = texto;
        t.style.position = 'fixed';
        t.style.opacity = '0';
        document.body.appendChild(t);
        t.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(t);
        if (!ok) return mostrarToast('Não foi possível copiar.');
    }
    mostrarToast('Relatórios copiados!');
}
        
        // Reduz a foto e salva em WebP: página e banco ficam bem mais leves
        function comprimirFoto(file) {
            return new Promise(resolve => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const escala = Math.min(1, 480 / Math.max(img.width, img.height));
                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * escala);
                    c.height = Math.round(img.height * escala);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    resolve(c.toDataURL('image/webp', 0.8));
                };
                img.src = url;
            });
        }

        async function alterarFoto(input, id, doModal = false) {
            if (input.files && input.files[0]) {
                const dataUrl = await comprimirFoto(input.files[0]);
                await sb.from('alunos').update({ foto_url: dataUrl }).eq('id', id);
                const aluno = alunos.find(a => a.id === id);
                if (aluno) aluno.foto_url = dataUrl;
                if (doModal) abrirModalAluno(id);
                renderTabela();
                renderRelatorios();
            }
        }

const PERFIS_PED = { participativo: 'Participativo', pouco_participativo: 'Pouco participativo', agitado: 'Agitado', melhorar: 'Melhorar' };
const PERFIS_COMP = { lider: 'Líder', competitivo: 'Competitivo(a)', ansioso: 'Ansioso(a)', disperso: 'Disperso(a)', convivencia: 'Em desenvolvimento nas relações' };

function opcoesPerfil(lista, atual) {
    return `<option value="" ${!lista[atual] ? 'selected' : ''}>Selecione...</option>` +
        Object.entries(lista).map(([v, n]) => `<option value="${v}" ${v === atual ? 'selected' : ''}>${n}</option>`).join('');
}
function perfisCompletos(a) { return !!(a && PERFIS_PED[a.perfil] && PERFIS_COMP[a.perfil_comp]); }

document.getElementById('perfilInd').innerHTML = opcoesPerfil(PERFIS_PED, '');
document.getElementById('perfilCompInd').innerHTML = opcoesPerfil(PERFIS_COMP, '');

async function trocarPerfil(id, campo, valor) {
    await atualizarDado(id, campo, valor || null);
    const a = alunos.find(al => al.id === id);
    if (perfisCompletos(a)) {
        await gerarIndividual(id, false);
        mostrarToast(`Relatório de ${a.nome.split(' ')[0]} gerado.`);
    } else {
        mostrarToast('Escolha também o outro perfil para gerar o relatório.');
    }
    abrirModalAluno(id);
}
function lerRel(txt) {
    try { const o = JSON.parse(txt); if (o && o.p) return o; } catch (e) {}
    return { p: txt || '', c: '', o: '' };
}
function juntarRel(txt, sep = '\n\n') {
    const r = lerRel(txt);
    return [r.p, r.c, r.o].filter(Boolean).join(sep);
}

function montarRelatorio(a) {
    const ped = BANCO[a.perfil];        // parágrafo pedagógico + observações
    const comp = BANCO[a.perfil_comp];  // parágrafo comportamental e emocional
    const nome = a.nome.trim().split(/\s+/)[0];
    const fem = a.genero === 'fem';
    const pick = arr => Math.floor(Math.random() * arr.length);
    const ordens = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
    const usados = new Set(alunos
        .filter(x => x.turma === a.turma && x.id !== a.id && relatoriosSalvosMap[x.id])
        .map(x => lerRel(relatoriosSalvosMap[x.id]).kc));
    let kc, ic;
    for (let t = 0; t < 80; t++) {
        ic = [pick(ped.p1), pick(ped.p2), pick(ped.o), pick(comp.c1), pick(comp.c2), pick(comp.c3), Math.floor(Math.random() * 6)];
        kc = a.perfil + '|' + a.perfil_comp + '|' + ic.join('-');
        if (!usados.has(kc)) break;
    }
    const f = s => s.replace(/@/g, fem ? 'a' : 'o').replace(/\{n\}/g, nome);
    const fr = [comp.c1[ic[3]], comp.c2[ic[4]], comp.c3[ic[5]]];
    const c = ordens[ic[6]].map(i => fr[i]).join(' ');
    return JSON.stringify({ kc, p: f(ped.p1[ic[0]] + ' ' + ped.p2[ic[1]]), c: f(c), o: f(ped.o[ic[2]]) });
}

async function gerarIndividual(id, rolar = true) {
    const a = alunos.find(al => al.id === id);
    if (!perfisCompletos(a)) {
        mostrarToast('Escolha os dois perfis do aluno para gerar o relatório.');
        abrirModalAluno(id);
        return;
    }
    const textoFinal = montarRelatorio(a);
    relatoriosSalvosMap[id] = textoFinal;
    await sb.from('relatorios').upsert({ aluno_id: id, texto_completo: textoFinal });
    renderRelatorios();
    if (rolar) rolarAte(id);
}

function paginaRel(a, r, dataImp) {
    const fmt = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const itens = ['Língua Portuguesa', 'Matemática', 'Ciências Naturais', 'História / Geografia', 'Arte', 'Socioemocional', 'Ed. Física', 'Inglês', 'Música', 'Balé/ Judô'];
    const topo = '<img class="timbrado" src="timbrado-relatorio.webp" alt="">';
    return `<section class="folha">${topo}<div class="conteudo">
        <p class="rt">RELATÓRIO INDIVIDUAL DE DESENVOLVIMENTO DO ESTUDANTE</p>
        <p class="rt">Ensino Fundamental – Anos Iniciais | 1º ao 5º ano</p>
        <p><b>Estudante:</b> ${fmt(a.nome)}</p>
        <p class="rg" style="--c:101mm"><span><b>Turma:</b> ${fmt(a.turma)}</span><span><b>Ano letivo:</b> ${REL_ANO}</span></p>
        <p class="rg" style="--c:92mm"><span><b>Bimestre:</b> ${REL_BIMESTRE}</span><span><b>Data: ${REL_DATA}</b></span></p>
        <p class="rj"><b><u>Componente(s) Curricular(es)</u></b> (assinale qual (quais) o (s) seu(s) componente(s) curricular(es)</p>
        ${itens.map(i => `<p class="ri">( ${i === 'Ed. Física' ? 'X' : '&nbsp;&nbsp;&nbsp;'} ) ${i}</p>`).join('')}
        <p class="rh">Desenvolvimento pedagógico:</p><p class="rx">${fmt(r.p)}</p>
        <p class="rh">Desenvolvimento comportamental e emocional:</p><p class="rx">${fmt(r.c)}</p>
        <p class="rh">OBSERVAÇÕES FINAIS (se necessário)</p><p class="rx rxo">${fmt(r.o)}</p>
        <p class="rh">Professor(a) responsável pelo registro: <span style="font-weight:400">${fmt(REL_PROFESSOR)}</span></p>
        <p class="rh">Data: <span style="font-weight:400">${dataImp}</span></p>
    </div></section>`;
}

async function imprimirRelatorios() {
    const lista = alunos
        .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
        .sort((a, b) => a.nome.localeCompare(b.nome));
    if (lista.length === 0) return mostrarToast('Não há relatórios para imprimir.');
    const area = document.getElementById('folhaImpressao');
const dataImp = new Date().toLocaleDateString('pt-BR');
area.innerHTML = lista.map(a => paginaRel(a, lerRel(relatoriosSalvosMap[a.id]), dataImp)).join('');    await Promise.all([...area.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
    window.print();
}

async function gerarTurmaToda() {
    const turma = alunos.filter(a => a.turma === turmaAtiva);
    const prontos = turma.filter(perfisCompletos);
    const faltam = turma.length - prontos.length;
    if (prontos.length === 0) return mostrarToast('Escolha os dois perfis de cada aluno para gerar.');
    await Promise.all(prontos.map(a => gerarIndividual(a.id, false)));
    if (faltam > 0) mostrarToast(`${faltam} aluno(s) ficaram sem relatório: faltam perfis.`);
    const area = document.getElementById('resultadoArea');
    if (area.classList.contains('hidden')) return;
    requestAnimationFrame(() => requestAnimationFrame(() => {
        window.scrollTo({ top: area.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
    }));
}

       function renderRelatorios() {
    const area = document.getElementById('resultadoArea');
    const container = document.getElementById('listaRelatorios');

    const filtrados = alunos
        .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
        .sort((a, b) => a.nome.localeCompare(b.nome));

    const html = filtrados.map(a => {
        return `<article id="rel-${a.id}" class="flex flex-col md:flex-row items-center md:items-start gap-4 p-4 rounded-2xl border relative transition-shadow" style="background:var(--bg);border-color:var(--line)">
            <button onclick="removerRelatorio('${a.id}')" class="no-print absolute top-2 right-2 w-10 h-10 rounded-full text-gray-500 hover:bg-gray-200" aria-label="Remover relatório de ${a.nome}">✕</button>
            ${a.foto_url ? `<img src="${a.foto_url}" alt="Foto de ${a.nome}" loading="lazy" class="w-24 h-24 rounded-2xl object-cover bg-white flex-shrink-0">` : ''}
            <div class="flex-1 text-center md:text-justify"><p class="font-display font-semibold">${a.nome.toUpperCase()} (${turmaAtiva})</p><p class="text-sm mt-1 leading-relaxed" style="color:#2d3748">${juntarRel(relatoriosSalvosMap[a.id], '<br><br>')}</p></div></article>`;
    }).join('');

    if (html) { area.classList.remove('hidden'); container.innerHTML = html; } else area.classList.add('hidden');
}

async function removerRelatorio(id) {
    const a = alunos.find(al => al.id === id);
    const ok = await confirmarSite('Excluir relatório?', `O relatório de ${a ? a.nome : 'este aluno'} será apagado. Você pode gerar outro depois.`);
    if (!ok) return;
    await sb.from('relatorios').delete().eq('aluno_id', id);
    delete relatoriosSalvosMap[id];
    renderRelatorios();
}

function irParaPrimeiroRelatorio() {
    const primeiro = alunos
        .filter(a => a.turma === turmaAtiva && relatoriosSalvosMap[a.id])
        .sort((a, b) => a.nome.localeCompare(b.nome))[0];
    if (!primeiro) return mostrarToast('Esta turma ainda não tem relatórios. Clique em Gerar.');
    rolarAte(primeiro.id);
}

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

    document.getElementById('btnTopo').classList.toggle('show', window.scrollY > 600);
}, { passive: true });

// INÍCIO AUTH
async function entrar() {
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;
    const erro = document.getElementById('loginErro');
    const btn = document.getElementById('loginBtn');
    erro.textContent = '';
    if (!email || !senha) { erro.textContent = 'Informe e-mail e senha.'; return; }
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (error) { erro.textContent = 'E-mail ou senha incorretos.'; return; }
    document.getElementById('loginSenha').value = '';
}

async function sair() {
    await sb.auth.signOut();
}

let usuarioAtual = null;
sb.auth.onAuthStateChange((evento, sessao) => {
    if (sessao && sessao.user) {
        document.getElementById('telaLogin').classList.add('hidden');
        // Só carrega quando o usuário muda (evita recarregar a cada renovação de token)
        if (sessao.user.id !== usuarioAtual) {
            usuarioAtual = sessao.user.id;
            // setTimeout evita travar o cliente do Supabase dentro deste callback
            setTimeout(() => { mostrarAba('alunos'); carregar(); }, 0);
        }
    } else {
        usuarioAtual = null;
        alunos = []; turmaAtiva = ""; relatoriosSalvosMap = {};
        renderTabs(); renderTabela(); renderRelatorios();
        document.getElementById('telaLogin').classList.remove('hidden');
    }
});
// FINAL AUTH
